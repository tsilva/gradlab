defaults:
- atari-ppo@_global_
- _self_

train:
  checkpoint_eval_backend: none
  timesteps: 10000000
  # Fuse normalized health and horizon state with pixels for both output heads.
  policy_model:
    schema_version: 2
    encoder:
      kind: nature_cnn
      features_dim: 512
    fusion: {hidden_sizes: [256], activation: tanh}
    normalize_images: true
    orthogonal_init: true
  backend:
    config:
      n_steps: 256
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 2500000
        patience_steps: 2500000
