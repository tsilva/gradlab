defaults:
- _self_
train:
  timesteps: 50000000
  policy_model:
    schema_version: 2
    encoder:
      kind: nature_cnn
      features_dim: 256
    fusion: {hidden_sizes: [512, 512], activation: tanh}
    normalize_images: true
    orthogonal_init: true
  backend:
    id: sb3.ppo
    config:
      n_steps: 512
      batch_size: 512
      n_epochs: 10
      learning_rate: 1.5e-4
      learning_rate_final: 1.0e-4
      learning_rate_schedule_timesteps: 4000000
      ent_coef: 0.01
      ent_coef_final: 1.0e-4
      ent_coef_schedule_timesteps: 4000000
      gamma: 0.9
      gae_lambda: 1.0
      clip_range: 0.15
      target_kl: 0.16
      vf_coef: 1.0
      adam_eps: 1.0e-08
      normalize_advantage: false
      advantage_normalization:
        mode: grouped
        context: task_id
logging:
  wandb_mode: online
