defaults:
- mario-single-ppo@_global_
- _self_
train:
  # Mixed-state policies share the Mario schedule and optimizer, with a larger
  # task-conditioned fusion trunk and grouped advantage normalization.
  policy_model:
    encoder:
      features_dim: 256
    fusion: {hidden_sizes: [512, 512], activation: tanh}
  backend:
    config:
      advantage_normalization:
        mode: grouped
        context: task_id
