defaults:
- breakout-ball-state-ablation-ppo@_global_
- _self_

# Shared FirstWall/TwoWalls policy, optimizer, reward and training budget.
train:
  timesteps: 191561728
  backend:
    id: gradlab.ppo
    config:
      execution_profile: max-throughput
      batch_size: 512
      gamma: 0.999
      gae_lambda: 0.95
      n_steps: 128
      learning_rate: 0.00025
      learning_rate_final: null
      learning_rate_schedule_timesteps: 0
      learning_rate_milestones:
      - {step: 40001536, value: 5.0e-05}
      - {step: 171016192, value: 5.0e-05}
      - {step: 171024384, value: 2.5e-05}
      - {step: 171540480, value: 2.5e-05}
      - {step: 171548672, value: 1.0e-05}
      - {step: 176545792, value: 1.0e-05}
      - {step: 176553984, value: 5.0e-06}
  environment:
    env_config:
      n_envs: 64
    task:
      signals:
        policy_paddle_vx: paddle_vx_normalized
        policy_lives: lives_normalized
      model_inputs:
        schema_version: 1
        context:
          ball_x:
            signal: policy_ball_x
            update: transition
            encoding: {kind: continuous, scale: 2.0, offset: -1.0, low: null, high: null, clip: false}
          ball_y:
            signal: policy_ball_y
            update: transition
            encoding: {kind: continuous, scale: 2.0, offset: -1.0, low: null, high: null, clip: false}
          ball_vx:
            signal: policy_ball_vx
            update: transition
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
          ball_vy:
            signal: policy_ball_vy
            update: transition
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
          paddle_x:
            signal: policy_paddle_x
            update: transition
            encoding: {kind: continuous, scale: 2.0, offset: -1.0, low: null, high: null, clip: false}
          paddle_vx:
            signal: policy_paddle_vx
            update: transition
            # Signed last-native-frame displacement / screen width; preserve inertia and edge clamping.
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
          paddle_width:
            signal: policy_paddle_width
            update: transition
            encoding: {kind: continuous, scale: 8.0, offset: -7.0, low: null, high: null, clip: false}
          ball_paddle_offset:
            signal: policy_ball_paddle_offset
            update: transition
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
          lives_normalized:
            signal: policy_lives
            update: transition
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
      events:
        brick_destroyed:
          signal: bricks_destroyed
          operation: increase
      reward:
        # Exclude native score; retain inherited life-loss and serve-stall rewards.
        reward_mode: events
        event_delta_rewards:
          brick_destroyed: 1.0
        event_rewards:
          wall_cleared: 20.0
