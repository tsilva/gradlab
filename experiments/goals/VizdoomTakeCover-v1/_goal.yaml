defaults:
- ../_vizdoom-common@_global_
- _self_
title: ViZDoom Take Cover survival
train:
  environment:
    env_config:
      env_args:
        info_filter:
          mode: all
          keys: [player_dead]
    task:
      signals:
        player_dead: player_dead
      events:
        player_died: {signal: player_dead, operation: equals_for, value: 1, steps: 1}
        survived: {signal: player_dead, operation: equals_for, value: 0, steps: 512}
      termination:
        failure: [player_died]
        success: [survived]
        max_episode_steps: 512
      reward:
        reward_mode: native
        reward_scale: 100.0
        reward_clip: false
eval:
  environment:
    env_config:
      env_args:
        info_filter:
          mode: all
          keys: [player_dead]
    task:
      signals:
        player_dead: player_dead
      events:
        player_died: {signal: player_dead, operation: equals_for, value: 1, steps: 1}
        survived: {signal: player_dead, operation: equals_for, value: 0, steps: 512}
      termination:
        failure: [player_died]
        success: [survived]
        max_episode_steps: 512
      reward:
        reward_mode: native
        reward_scale: 100.0
        reward_clip: false
