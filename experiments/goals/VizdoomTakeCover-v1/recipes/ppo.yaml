defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: >-
  Seed {{ seed }} trains PPO from pixels to evade projectiles for 512 policy steps in Take Cover
  until the timestep cap or return plateau. This run is training-only; goal-owned evaluation
  remains available for later explicit use.
train:
  checkpoint_eval_backend: none
  timesteps: 10000000
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 2500000
        patience_steps: 2500000
