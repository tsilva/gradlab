defaults:
- _goal-family-common@_global_
- _self_
# SuperMario single-state goals intentionally map the source state from goal identity.
template_vars:
  state: "{{ goal_id }}"

train:
  environment:
    env_config:
      # Stable Retro state id; single-state Mario goals use the goal id as the source state.
      state: "{{ state }}"

eval:
  environment:
    env_config:
      # Eval must name the same start explicitly; it cannot inherit a provider default.
      state: "{{ state }}"
