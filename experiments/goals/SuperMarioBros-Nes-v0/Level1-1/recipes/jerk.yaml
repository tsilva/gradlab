defaults:
- _self_
reward_shape: speedrun-v1
recipe_id: jerk
description: Vectorized deterministic JERK search for a level-clearing {{ goal_id }} action sequence.
train:
  timesteps: 10000000
  backend:
    id: gradlab.jerk
    config:
      acceptance_mode: first_training_success
      archive_replay_probability_initial: 0.25
      archive_replay_probability_max: 0.9
      protected_prefix_steps: 128
      max_prefix_shorten_steps: 128
      retained_limit: 256
      fallback_action: noop
      log_interval_steps: 10000
logging:
  wandb: true
  wandb_mode: online
