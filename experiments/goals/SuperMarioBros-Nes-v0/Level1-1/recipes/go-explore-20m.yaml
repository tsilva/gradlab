defaults:
- _self_
reward_shape: speedrun-v1
recipe_id: go-explore-20m
description: >-
  Seed {{ seed }} runs route-aware Go-Explore trajectory discovery for {{ goal_id }}
  over an ephemeral local state archive, persists only the best open-loop action
  program, and caps search at 20 million transitions with checkpoint evaluation
  as acceptance authority.
train:
  timesteps: 20000000
  early_stop:
    conditions:
      progress_plateau:
        metric: train/algorithm/go_explore/best/progress
        trigger: no_improvement
        direction: maximize
        min_delta: 1.0
        delta_mode: absolute
        start_after_steps: 1000000
        patience_steps: 1000000
        outcome: failure
        action: stop
  state_archive:
    semantic_id: state-archive-v1
    persistence: ephemeral
    restore_semantics: continuation
    recorder:
      mode: backend
      cell:
        dimensions:
        - {signal: level_hi, bucket_size: 1}
        - {signal: level_lo, bucket_size: 1}
        - {signal: area_id, bucket_size: 1}
        - {signal: area_pointer, bucket_size: 1}
        - {signal: x_pos, bucket_size: 8}
        - {signal: y_pos, bucket_size: 16}
        - {signal: player_task, equals: 8}
        - {signal: loop_command_active, bucket_size: 1}
        - {signal: loop_correct_count, bucket_size: 1, clamp: [0, 7]}
        - {signal: loop_pass_count, bucket_size: 1, clamp: [0, 7]}
        - {signal: player_motion, equals: 0}
        - {signal: player_power, bucket_size: 1}
    export:
      snapshots: none
    curriculum: null
  backend:
    id: gradlab.go-explore
    config:
      explore_steps: 128
      progress_guided_restore_probability: 0.5
      success_guided_restore_probability: 0.5
      run_duration_mean: 4.0
      run_duration_max: 32
      fallback_action: noop
      progress_signal: x
      log_interval_steps: 10000
      compaction_interval_steps: 250000
logging:
  wandb: true
  wandb_mode: online
