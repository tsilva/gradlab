defaults:
- ../_goal-family-common@_global_
- ../_reward-shapes-common@_global_
- _self_
tags:
- "goal_id:{{ goal_id }}"
- "recipe_id:{{ recipe_id }}"
- "env_id:{{ env_id }}"
- mario
- level1-1
- level1-2
- mixed-state
title: Sample-efficient SuperMarioBros-NES Levels 1-1 and 1-2 completion
objective:
  states:
  - Level1-1
  - Level1-2
train:
  environment:
    env_config:
      states:
      - Level1-1
      - Level1-2
      state_probs:
      - 0.5
      - 0.5
    task:
      conditioning:
        enabled: true
        signal: level
        values:
        - [0, 0]
        - [0, 1]
eval:
  environment:
    env_config:
      states:
      - Level1-1
      - Level1-2
      state_probs:
      - 0.5
      - 0.5
      # Promotion eval remains vectorized; the lane count is part of its reproducible protocol.
      n_envs: 16
    task:
      conditioning:
        enabled: true
        signal: level
        values:
        - [0, 0]
        - [0, 1]
