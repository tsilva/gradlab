defaults:
- ../../../../recipes/_presets/mario-single-ppo@_global_
- _self_
recipe_id: ppo-sil-actor-only
description: Reproduce the Mario Level1-3 standard actor-only SIL checkpoint at the original seed 1801 budget.
seeds: [1801]
reward_shape: sft-ppo-v1
train:
  # Seed 1801 first cleared at rollout step 921600, then trained for 8388608 more.
  # This is an absolute reproduction budget for that seed.
  timesteps: 9310208
  early_stop: null
  checkpoint_freq: 0
  checkpoint_steps: [921600, 1970176, 3018752, 5115904]
  checkpoint_candidates: null
  checkpoint_eval_backend: none
  environment:
    env_config:
      n_envs: 16
  policy_model:
    share_features_extractor: false
  backend:
    id: gradlab.ppo
    config:
      precision: fp32
      execution_profile: sb3-parity
      device: cuda
      bootstrap_truncations: false
      gamma: 0.999
      gae_lambda: 1.0
      learning_rate: 1.0e-4
      learning_rate_final: 1.0e-4
      n_steps: 256
      batch_size: 256
      n_epochs: 4
      normalize_advantage: true
      clip_range: 0.1
      target_kl: 0.01
      ent_coef: 0.01
      ent_coef_final: 0.01
      ent_coef_schedule_timesteps: 16777216
      vf_coef: 0.5
      sil:
        enabled: true
        learning_rate: 1.0e-4
        updates_per_rollout: 16
        batch_size: 256
        candidate_pool_size: 2048
        recent_capacity_transitions: 65536
        success_capacity_transitions: 65536
        success_capacity_episodes: 32
        success_sample_fraction: 0.5
        replay_seed: 73411
        control_signal: player_task
        control_value: 8
