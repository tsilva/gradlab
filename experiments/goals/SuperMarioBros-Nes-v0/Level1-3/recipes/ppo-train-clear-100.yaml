defaults:
- ../../../../recipes/_presets/mario-single-ppo@_global_
- _self_
reward_shape: speedrun-v1
recipe_id: ppo-train-clear-100
description: Training-only PPO for {{ goal_id }}, targeting 100 consecutive clears.
train:
  checkpoint_eval_backend: none
  early_stop:
    conditions:
      clear_100:
        metric: train/outcome/success/starts/all/rolling/rate/min
        trigger: threshold
        operator: '>='
        progress_baseline: 0.0
        threshold: 1.0
        patience_steps: 0
        outcome: success
        action: stop
