goal_id: DistillAllLevels
title: Mario all-level offline distillation
evaluation_mode: training_only
tags:
- "goal_id:{{ goal_id }}"
- "recipe_id:{{ recipe_id }}"
- "env_id:{{ env_id }}"
objective:
  rank:
  - min(train/distill/development/worst_teacher_gap/fraction)
  - max(train/distill/development/clear/fraction)
  training_success:
    metric: train/distill/development/worst_teacher_gap/fraction
    operator: <=
    threshold: 0.05
train:
  environment:
    env_provider: env-supermariobrosnes-turbo-emu
    env_config:
      game: SuperMarioBros-Nes-v0
      n_envs: 32
      env_args:
        scenario: scenario
        info: data
        use_restricted_actions: basic
        record: false
        players: 1
        inttype: stable
        obs_type: image
        render_mode: rgb_array
        num_threads: 16
        rom_path: null
        obs_copy: safe_view
        obs_grayscale: true
        obs_layout: chw
        frame_stack: 4
        noop_reset_max: 0
        info_filter: all
        use_fire_reset: false
      frame_skip: 4
      max_pool_frames: false
      sticky_action_prob: 0.0
      obs_resize:
      - 84
      - 84
      obs_crop:
      - 32
      - 0
      - 0
      - 0
      obs_crop_mode: mask
      obs_crop_fill: 0
      obs_resize_algorithm: area
      state: Level1-1
    task:
      id: mario
      action:
        set: native
      signals:
        x:
        - xscrollHi
        - xscrollLo
        score: score
        lives: lives
        level:
        - levelHi
        - levelLo
        level_hi: levelHi
        level_lo: levelLo
        area_id: area_id
        area_pointer: area_pointer
        x_pos: x_pos
        y_pos: y_pos
        player_task: player_task
        loop_command_active: loop_command_active
        loop_correct_count: loop_correct_count
        loop_pass_count: loop_pass_count
        player_motion: player_motion
        player_power: player_power
      events:
        life_loss:
          signal: lives
          operation: decrease
        level_change:
          signal: level
          operation: change
        stalled:
          signal: x
          operation: unchanged_for
          steps: 300
      termination:
        failure:
        - life_loss
        success:
        - level_change
        timeout:
        - stalled
        max_episode_steps: 4500
      reward:
        completion_reward: 0.0
        death_penalty: 25.0
        progress_reward_boost_scale: 0.0
        progress_reward_boost_start_x: 0.0
        progress_reward_cap: 30.0
        progress_reward_scale: 1.0
        reward_clip: false
        reward_mode: additive
        reward_scale: 1.0
        score_progress_clipped: false
        terminal_reward: 50.0
        time_penalty: 0.001
        use_native_reward: false
