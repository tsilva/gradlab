defaults:
- ../../../../recipes/_presets/mario-single-ppo@_global_
- _self_
reward_shape: speedrun-v1
recipe_id: ppo
train:
  # The last accepted baseline cleared 100/100 by 28.6M transitions. Treat
  # failure to recover by 30M as a failed trajectory instead of spending 50M.
  timesteps: 30000000
  backend:
    config:
      # Keep rollout updates near the 0.015-0.024 KL regime observed in the
      # accepted Level1-2 run and stop before destructive policy drift.
      target_kl: 0.03
description: Stable low-KL, late-decay PPO baseline for {{ goal_id }}.
