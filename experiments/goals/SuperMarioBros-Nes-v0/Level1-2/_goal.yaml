# Hydra composition list; imports the shared Mario goal contract first.
defaults:
# Shared Mario goal contract supplies the environment contract and early-stop/eval defaults.
- ../_goal-common@_global_
- ../_reward-shapes-common@_global_
# Apply this file after the shared contract; goal-specific overrides can live here when needed.
- _self_

# Level1-2 policies can enter a no-progress attractor around the bonus/warp-zone
# transition. Reset those training lanes promptly instead of filling rollouts
# with episodes that survive until the shared hard cap.
train:
  environment:
    task:
      events:
        stalled: {signal: x, operation: unchanged_for, steps: 300}
      termination:
        failure: [life_loss, stalled]

# Preserve the same life-loss and no-progress episode boundaries during evaluation.
eval:
  environment:
    task:
      events:
        stalled: {signal: x, operation: unchanged_for, steps: 300}
      termination:
        failure: [life_loss, stalled]
