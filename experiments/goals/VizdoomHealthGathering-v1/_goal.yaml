# Compose this goal from reusable YAML configuration fragments.
defaults:
# Load the shared ViZDoom goal contract into the global configuration namespace.
- ../_vizdoom-common@_global_
# Apply this file last so health-gathering values override the shared defaults.
- _self_
# Give the goal a human-readable name for reports and operator-facing views.
title: ViZDoom Health Gathering survival
# Override the shared settings used while training a policy for this goal.
train:
  # Override the shared ViZDoom environment contract used for training.
  environment:
    # Supply arguments for the native vectorized ViZDoom environment.
    env_config:
      # Reuse these scenario-specific provider arguments in evaluation via the YAML anchor.
      env_args: &health_gathering_env_args
        # Collect health as a provider-owned game variable for critic context.
        game_variables: [HEALTH]
        # Configure which per-step information the provider exposes to GradLab.
        info_filter:
          # Control when the selected information keys are emitted.
          mode: all
          # List the provider information keys retained for task signals.
          keys: [player_dead, health]
    # Reuse these scenario-specific task overrides in evaluation via the YAML anchor.
    task: &health_gathering_task
      # Map task-level signal names to keys from the provider's per-step information.
      signals:
        # Map the task-level death signal to its provider information key.
        player_dead: player_dead
        # Expose current health as a typed model-input signal without changing reward.
        health: health
        # Map the provider's native timeout boundary to the survival signal.
        native_timeout: provider_truncated
      # Add current health to the policy observation contract.
      model_inputs:
        schema_version: 1
        context:
          health:
            signal: health
            update: transition
            encoding:
              kind: continuous
              scale: 0.01
              offset: 0.0
              # Preserve negative fatal-transition health and any provider over-health.
              low: -1.0
              high: 2.0
          # Expose the task runtime's lane-local episode clock as normalized time remaining.
          remaining_time:
            signal: episode_step
            update: transition
            encoding:
              kind: continuous
              # The native 2,100-tic horizon is 525 policy steps at four-frame skipping.
              scale: -0.0019047619047619048
              offset: 1.0
              low: 0.0
              high: 1.0
      # Define discrete task events derived from changes in the declared signals.
      events:
        # Detect death when the provider's death flag is asserted for a step.
        player_died: {signal: player_dead, operation: equals_for, value: 1, steps: 1}
        # Detect reaching the survival goal at the native scenario timeout.
        goal_reached: {signal: native_timeout, operation: equals_for, value: 1, steps: 1}
      # Define which task events end an episode and how each outcome is classified.
      termination:
        # List the events that mark an episode as failed.
        failure: [player_died]
        # List the events that mark an episode as successful.
        success: [goal_reached]
      # Configure the reward presented to the policy after the inherited native reward is computed.
      reward:
        # Set the positive divisor applied to native rewards before clipping.
        reward_scale: 100.0
# Override the shared settings used to evaluate checkpoints for this goal.
eval:
  # Override the shared ViZDoom environment contract used during evaluation.
  environment:
    # Supply evaluation-time arguments for the native vectorized ViZDoom environment.
    env_config:
      # Bound evaluation at the scenario's 2,100-tic native horizon after four-frame skipping.
      max_steps: 525
      # Reuse the scenario-specific provider arguments declared for training.
      env_args: *health_gathering_env_args
    # Merge the same scenario-specific task overrides into the shared evaluation defaults.
    task: *health_gathering_task
