defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: >-
  Seed {{ seed }} trains PPO from pixels to time a rocket interception in Predict Position, with
  stochastic 100-episode evaluation and checkpoint promotion at 95% monster elimination.
train:
  timesteps: 5000000
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 1250000
        patience_steps: 1250000
