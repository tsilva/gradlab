defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: >-
  Seed {{ seed }} trains PPO from pixels to time a rocket interception in Predict Position until
  the timestep cap or return plateau. This run is training-only; goal-owned evaluation remains
  available for later explicit use.
train:
  checkpoint_eval_backend: none
  timesteps: 5000000
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 1250000
        patience_steps: 1250000
