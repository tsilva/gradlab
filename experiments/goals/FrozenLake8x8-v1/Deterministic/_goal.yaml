defaults:
- ../../FrozenLake-v1/_goal@_global_
- _self_
title: Gymnasium FrozenLake deterministic 8x8 maze
train:
  environment:
    env_config:
      game: FrozenLake8x8-v1
      env_args:
        is_slippery: false
        # Fixed maze: 31 holes, two dead ends, and a 26-move shortest safe route.
        desc:
        - SFFHFFFH
        - HHFHHHFH
        - FHFHFFFH
        - FHFHFHFH
        - FFFHFHFH
        - FHHHFHFH
        - FFFFFHFF
        - HHHHHHHG
    task:
      termination:
        max_episode_steps: 200
