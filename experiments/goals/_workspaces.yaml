schema_version: 4
view_id: training
default_profile: training

sections:
  training_essentials:
    title: Training essentials
    pinned: true
    open: true
    columns: 2
    panels:
    - id: task_success_min
      kind: line
      x: train/step
      y:
      - train/success/min
    - id: task_success_mean
      kind: line
      x: train/step
      y:
      - train/success/mean
    - id: target_return_mean
      kind: line
      x: train/step
      y:
      - train/return/mean
    - id: target_return_max
      kind: line
      x: train/step
      y:
      - train/return/max
    - id: episode_length
      kind: line
      x: train/step
      y:
      - train/episode_steps/mean
    - id: completed_episodes
      kind: line
      x: train/step
      y:
      - train/episodes/count
    - id: early_stop_patience_progress
      kind: line
      x: train/step
      metric_templates:
      - train/patience/{condition}/fraction
    - id: explained_variance
      kind: line
      x: train/step
      y:
      - train/explained_variance
    - id: value_loss
      kind: line
      x: train/step
      y:
      - train/value_loss/mean
    - id: policy_entropy
      kind: line
      y_title: nats
      x: train/step
      y:
      - train/entropy/mean
    - id: ppo_approx_kl
      kind: line
      x: train/step
      y:
      - train/kl/mean
    - id: ppo_clip_fraction
      kind: line
      x: train/step
      y:
      - train/clip/fraction
    - id: loop_throughput
      kind: line
      x: train/step
      y:
      - train/throughput/rate
    - id: provider_step_throughput
      kind: line
      x: train/step
      y:
      - train/provider/rate
  breakout_primary:
    title: Primary metrics
    pinned: true
    open: true
    columns: 2
    panels:
    - id: primary_0
      kind: line
      y_title: fraction (last 100 episodes)
      x: train/step
      y:
      - train/progress/bricks_destroyed_normalized/mean
    - id: primary_1
      kind: line
      y_title: fraction (last 100 episodes)
      x: train/step
      y:
      - train/progress/bricks_destroyed_normalized/max
    - id: primary_2
      kind: line
      y_title: fraction (last 100 episodes)
      x: train/step
      y:
      - train/progress/bricks_destroyed_normalized/min
    - id: primary_3
      kind: line
      y_title: steps (last 100 episodes)
      x: train/step
      y:
      - train/episode_steps/mean
  breakout_secondary:
    title: Breakout diagnostics
    pinned: false
    open: true
    columns: 2
    panels:
    - id: target_bricks_destroyed_mean
      kind: line
      y_title: bricks (last 100 episodes)
      x: train/step
      y:
      - train/progress/bricks_destroyed/mean
    - id: top_target_return_mean
      kind: line
      y_title: return (last 100 episodes)
      x: train/step
      y:
      - train/return/mean
    - id: target_score_mean
      kind: line
      y_title: score (last 100 episodes)
      x: train/step
      y:
      - train/progress/score/mean
    - id: target_score_max
      kind: line
      y_title: score max (last 100 episodes)
      x: train/step
      y:
      - train/progress/score/max
    - id: serve_stall_count
      kind: line
      y_title: fraction (last 100 episodes)
      x: train/step
      y:
      - train/unsuccessful/serve_stall/fraction
    - id: serve_wait_rate
      kind: line
      y_title: fraction of transitions
      x: train/step
      y:
      - train/reward/event/serve_wait/fraction

profiles:
  training:
    display_name: GradLab Training
    primary_metrics: goal_rank
    run_scope: current_metrics_schema
    max_runs: 25
    sections:
    - training_essentials
  breakout_training:
    display_name: GradLab Training
    primary_metrics: none
    run_scope: current_metrics_schema
    max_runs: 25
    sections:
    - breakout_primary
    - breakout_secondary
    - training_essentials

# Every W&B project resolved from a checked-in active goal inherits the default profile.
# Project overrides may select another complete profile or omit panels whose metrics do not apply.
projects:
  Breakout-Atari2600-v0:
    profile: breakout_training
    exclude_panels:
    - task_success_min
    - task_success_mean
    - target_return_mean
    - episode_length
    - early_stop_patience_progress
