schema_version: 4
view_id: training
default_profile: training

sections:
  training_essentials:
    title: Training essentials
    pinned: true
    open: true
    columns: 2
    panels:
    - id: task_success_min
      kind: line
      x: train/global_step
      y:
      - train/outcome/success/starts/all/rolling/rate/min
    - id: task_success_mean
      kind: line
      x: train/global_step
      y:
      - train/outcome/success/starts/all/rolling/rate/mean
    - id: target_return_mean
      kind: line
      x: train/global_step
      y:
      - train/episode/return/shaped/origin/target/rolling/mean
    - id: target_return_max
      kind: line
      x: train/global_step
      y:
      - train/episode/return/shaped/origin/target/rolling/max
    - id: episode_length
      kind: line
      x: train/global_step
      y:
      - train/episode/length/origin/all/rolling/mean
    - id: completed_episodes
      kind: line
      x: train/global_step
      y:
      - train/episode/completed/count
    - id: early_stop_target_progress
      kind: line
      x: train/global_step
      metric_templates:
      - train/early_stop/{condition}/target/progress
    - id: early_stop_patience_progress
      kind: line
      x: train/global_step
      metric_templates:
      - train/early_stop/{condition}/patience/progress
    - id: explained_variance
      kind: line
      x: train/global_step
      y:
      - train/algorithm/ppo/value/explained_variance
      - train/algorithm/a2c/value/explained_variance
    - id: value_loss
      kind: line
      x: train/global_step
      y:
      - train/algorithm/ppo/update/value_loss
      - train/algorithm/a2c/update/value_loss
    - id: policy_entropy
      kind: line
      y_title: nats
      x: train/global_step
      y:
      - train/algorithm/ppo/policy/entropy
      - train/algorithm/a2c/policy/entropy
    - id: ppo_approx_kl
      kind: line
      x: train/global_step
      y:
      - train/algorithm/ppo/update/approx_kl
    - id: ppo_clip_fraction
      kind: line
      x: train/global_step
      y:
      - train/algorithm/ppo/update/clip_fraction
    - id: loop_throughput
      kind: line
      x: train/global_step
      y:
      - train/throughput/loop/rate
    - id: provider_step_throughput
      kind: line
      x: train/global_step
      y:
      - train/throughput/provider/step/rate
  breakout_diagnostics:
    title: Breakout diagnostics
    pinned: true
    open: true
    columns: 2
    panels:
    - id: serve_stall_count
      kind: line
      y_title: episodes (last 100)
      x: train/global_step
      y:
      - train/outcome/failure/reason/serve_stall/rolling/count
    - id: serve_wait_rate
      kind: line
      y_title: fraction of transitions
      x: train/global_step
      y:
      - train/reward/event/serve_wait/nonzero/rate

profiles:
  training:
    display_name: GradLab Training
    run_scope: current_metrics_schema
    max_runs: 25
    sections:
    - training_essentials
  breakout_training:
    display_name: GradLab Training
    run_scope: current_metrics_schema
    max_runs: 25
    sections:
    - training_essentials
    - breakout_diagnostics

# Every W&B project resolved from a checked-in active goal inherits the default profile.
# Project overrides may select another complete profile or omit panels whose metrics do not apply.
projects:
  Breakout-Atari2600-v0:
    profile: breakout_training
    exclude_panels:
    - task_success_min
    - task_success_mean
    - early_stop_target_progress
    - early_stop_patience_progress
    exclude_metrics:
    - train/algorithm/a2c/value/explained_variance
    - train/algorithm/a2c/update/value_loss
    - train/algorithm/a2c/policy/entropy
