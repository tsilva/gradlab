schema_version: 4
view_id: training
default_profile: training

sections:
  training_essentials:
    title: Training essentials
    pinned: true
    open: true
    columns: 2
    panels:
    - id: task_success_min
      kind: line
      x: train/global_step
      y:
      - train/target/success/start_rate_min
    - id: task_success_mean
      kind: line
      x: train/global_step
      y:
      - train/target/success/start_rate_mean
    - id: target_return_mean
      kind: line
      x: train/global_step
      y:
      - train/target/return_mean
    - id: target_return_max
      kind: line
      x: train/global_step
      y:
      - train/target/return_max
    - id: episode_length
      kind: line
      x: train/global_step
      y:
      - train/all/episode_steps_mean
    - id: completed_episodes
      kind: line
      x: train/global_step
      y:
      - train/all/episodes_total
    - id: early_stop_target_progress
      kind: line
      x: train/global_step
      metric_templates:
      - train/early_stop/{condition}/target/progress
    - id: early_stop_patience_progress
      kind: line
      x: train/global_step
      metric_templates:
      - train/early_stop/{condition}/patience/progress
    - id: explained_variance
      kind: line
      x: train/global_step
      y:
      - train/ppo/explained_variance
      - train/a2c/explained_variance
    - id: value_loss
      kind: line
      x: train/global_step
      y:
      - train/ppo/value_loss
      - train/a2c/value_loss
    - id: policy_entropy
      kind: line
      y_title: nats
      x: train/global_step
      y:
      - train/ppo/entropy
      - train/a2c/entropy
    - id: ppo_approx_kl
      kind: line
      x: train/global_step
      y:
      - train/ppo/approx_kl
    - id: ppo_clip_fraction
      kind: line
      x: train/global_step
      y:
      - train/ppo/clip_fraction
    - id: loop_throughput
      kind: line
      x: train/global_step
      y:
      - train/throughput/loop/rate
    - id: provider_step_throughput
      kind: line
      x: train/global_step
      y:
      - train/throughput/provider/step/rate
  breakout_secondary:
    title: Breakout diagnostics
    pinned: false
    open: true
    columns: 2
    panels:
    - id: target_bricks_destroyed_normalized_mean
      kind: line
      y_title: fraction (last 100 episodes)
      x: train/global_step
      y:
      - train/target/progress/bricks_destroyed_normalized/mean
    - id: top_target_return_mean
      kind: line
      y_title: return (last 100 episodes)
      x: train/global_step
      y:
      - train/target/return_mean
    - id: target_score_mean
      kind: line
      y_title: score (last 100 episodes)
      x: train/global_step
      y:
      - train/target/progress/score/mean
    - id: target_score_max
      kind: line
      y_title: score max (last 100 episodes)
      x: train/global_step
      y:
      - train/target/progress/score/max
    - id: serve_stall_count
      kind: line
      y_title: episodes (last 100)
      x: train/global_step
      y:
      - train/all/boundary_event/serve_stall/rolling/count
    - id: serve_wait_rate
      kind: line
      y_title: fraction of transitions
      x: train/global_step
      y:
      - train/reward/event/serve_wait/nonzero/rate

profiles:
  training:
    display_name: GradLab Training
    primary_metrics: goal_rank
    run_scope: current_metrics_schema
    max_runs: 25
    sections:
    - training_essentials
  breakout_training:
    display_name: GradLab Training
    primary_metrics: goal_rank
    run_scope: current_metrics_schema
    max_runs: 25
    sections:
    - breakout_secondary
    - training_essentials

# Every W&B project resolved from a checked-in active goal inherits the default profile.
# Project overrides may select another complete profile or omit panels whose metrics do not apply.
projects:
  Breakout-Atari2600-v0:
    profile: breakout_training
    exclude_panels:
    - task_success_min
    - task_success_mean
    - target_return_mean
    - episode_length
    - early_stop_target_progress
    - early_stop_patience_progress
