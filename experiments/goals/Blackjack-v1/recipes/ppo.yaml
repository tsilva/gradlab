defaults:
- ../../../recipes/_presets/gymnasium-discrete-ppo@_global_
- _self_
recipe_id: ppo
description: Gymnasium Blackjack-v1 PPO baseline with a fixed MultiDiscrete tuple encoding.
train:
  timesteps: 1000000
  early_stop:
    conditions:
      return_plateau:
        metric: train/episode/return/shaped/origin/target/rolling/mean
        trigger: no_improvement
        direction: maximize
        min_delta: 0.01
        delta_mode: absolute
        start_after_steps: 250000
        patience_steps: 250000
        outcome: neutral
        action: stop
  backend:
    config:
      n_steps: 64
      batch_size: 512
      n_epochs: 10
      learning_rate: 3.0e-4
      gamma: 1.0
      gae_lambda: 1.0
