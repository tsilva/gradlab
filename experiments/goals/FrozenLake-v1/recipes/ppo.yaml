defaults:
- ../../../recipes/_presets/gymnasium-discrete-ppo@_global_
- _self_
recipe_id: ppo
description: Gymnasium FrozenLake-v1 PPO baseline over native categorical observations.
train:
  timesteps: 500000
  early_stop:
    conditions:
      return_target:
        metric: train/episode/return/shaped/origin/target/rolling/mean
        trigger: threshold
        operator: '>='
        threshold: 0.7
        start_after_steps: 50000
        patience_steps: 0
        outcome: success
        action: stop
      return_plateau:
        metric: train/episode/return/shaped/origin/target/rolling/mean
        trigger: no_improvement
        direction: maximize
        min_delta: 0.01
        delta_mode: absolute
        start_after_steps: 125000
        patience_steps: 125000
        outcome: neutral
        action: stop
  backend:
    config:
      n_steps: 128
      batch_size: 256
      n_epochs: 10
      learning_rate: 3.0e-4
      gamma: 0.99
      gae_lambda: 0.95
