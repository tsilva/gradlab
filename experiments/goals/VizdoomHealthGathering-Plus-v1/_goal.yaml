# Compose the surface-variant goal from the complete Health Gathering goal.
defaults:
# Inherit the complete survival, observation, evaluation, and training-stop contracts.
- ../VizdoomHealthGathering-v1/_goal@_global_
# Apply the Plus-specific environment identity overrides last.
- _self_

title: ViZDoom Health Gathering surface-variant survival

train:
  environment:
    env_config:
      # Run surface variants against the original Health Gathering scenario.
      game: VizdoomHealthGathering-v1

eval:
  environment:
    env_config:
      # Evaluate surface variants against the same original scenario contract.
      game: VizdoomHealthGathering-v1
