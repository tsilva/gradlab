defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: gradoom-ppo
description: GPU-resident GraDOOM Deathmatch PPO trained on one RTX 4090 and evaluated zero-shot in reference ViZDoom.
reward_shape: native-v1
train:
  timesteps: 50000000
  checkpoint_eval_backend: none
  environment:
    # Training uses GraDOOM; the goal-owned checkpoint evaluator remains env-vizdoom-turbo.
    env_provider: env-doom-turbo-torch
    env_config:
      # GPU-resident GraDOOM scales to thousands of lanes; 2048 won the 128..4096
      # time-to-rolling-kills sweep on beast-3 (~9.5k steps/s, best kills curve).
      n_envs: 2048
      env_args:
        # GraDOOM is single-stream GPU execution; the API expects None for device-backed execution.
        num_threads: null
        # Keep the supported eager engine until the production CUDA graph passes its release gate.
        compile_engine: false
    preprocessing:
      frame_skip: 2
      obs_crop: [0, 32, 0, 0]
      obs_crop_mode: mask
      obs_crop_fill: 0
  policy_model:
    schema_version: 2
    encoder:
      kind: nature_cnn
      features_dim: 512
    fusion: {hidden_sizes: [256], activation: tanh}
    normalize_images: true
    orthogonal_init: true
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 25000000
        patience_steps: 25000000
        action: observe
  backend:
    id: gradlab.ppo
    config:
      execution_profile: max-throughput
      precision: amp-fp16
      n_steps: 32
      n_epochs: 2
      learning_rate: 6.25e-5
      gamma: 0.995
      gae_lambda: 0.95
