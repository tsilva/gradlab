defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: Single-player ViZDoom Deathmatch custom PPO with 128-environment, 32-step rollouts, 1024-sample minibatches, frame skip 2, masked HUD pixels, and four-frame shared combat-state history.
# Preserve native rewards by default; launch overrides may select sample-factory-v0.
reward_shape: native-v1
train:
  checkpoint_eval_backend: none
  timesteps: 500000000
  # Keep the frame-skip-2 aiming contract and exclude redundant HUD pixels.
  environment:
    preprocessing:
      frame_skip: 2
      obs_crop: [0, 32, 0, 0]
      obs_crop_mode: mask
      obs_crop_fill: 0
  # Share survivability and weapon state through one actor-critic fusion trunk.
  policy_model:
    schema_version: 2
    encoder:
      kind: nature_cnn
      features_dim: 512
    fusion: {hidden_sizes: [256], activation: tanh}
    normalize_images: true
    orthogonal_init: true
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 25000000
        patience_steps: 25000000
        # Preserve plateau telemetry without stopping this bounded Deathmatch run.
        action: observe
  backend:
    id: gradlab.ppo
    config:
      # Use the measured Beast-3 winner with compiled calls, fused Adam, and device permutations.
      execution_profile: max-throughput
      # Pair 32-step rollout fragments with the goal's 128 training environments.
      n_steps: 32
      # Split each 4096-transition rollout into four GPU-efficient minibatches per epoch.
      batch_size: 1024
      n_epochs: 2
      # Use the matched seed-123 learning-rate winner while retaining two update epochs.
      learning_rate: 9.375e-5
      # Use the matched-ablation winner for frame-skip-2 credit assignment.
      gamma: 0.995
      gae_lambda: 0.95
