defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: Single-player ViZDoom Deathmatch pixel PPO with routed combat-state context.
train:
  checkpoint_eval_backend: none
  timesteps: 100000000
  # Keep health and armor critic-only while routing weapon state to both policy heads.
  policy_model:
    schema_version: 1
    topology:
      kind: shared_encoder
      encoder:
        kind: nature_cnn
        features_dim: 512
    fusion: post_encoder_concat
    context_encoders:
      armor: {kind: identity}
      health: {kind: identity}
      selected_weapon: {kind: one_hot}
      selected_weapon_ammo: {kind: identity}
    routes:
      armor: [state_value]
      health: [state_value]
      selected_weapon: [action, state_value]
      selected_weapon_ammo: [action, state_value]
    heads:
      action: {hidden_sizes: [], activation: tanh}
      state_value: {hidden_sizes: [256], activation: tanh}
    normalize_images: true
    orthogonal_init: true
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 25000000
        patience_steps: 25000000
        # Preserve plateau telemetry without stopping this bounded Deathmatch run.
        action: observe
  backend:
    config:
      n_epochs: 2
      learning_rate: 6.25e-5
