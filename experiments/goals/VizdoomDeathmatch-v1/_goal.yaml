# Compose this goal from reusable YAML configuration fragments.
defaults:
# Load the shared ViZDoom goal contract into the global configuration namespace.
- ../_vizdoom-common@_global_
# Apply this file last so Deathmatch values override the shared defaults.
- _self_
# Give the goal a human-readable name for reports and operator-facing views.
title: ViZDoom single-player Deathmatch score attack
# Declare named, provenance-bound reward contracts selectable by recipes and launch overrides.
reward_shapes:
  # Compile Deathmatch-specific reward definitions into both training and evaluation tasks.
  program_kind: vizdoom-deathmatch-v1
  # Preserve the existing native provider reward unless a run explicitly opts into shaping.
  default: native-v1
  definitions:
    # Retain the provider's native monster-kill reward unchanged.
    native-v1:
      reward_mode: native
      reward_scale: 1.0
      reward_clip: false
    # Adapt Sample Factory's Deathmatch V0 shaping to this six-slot monster scenario.
    sample-factory-v0:
      reward_mode: sample-factory-v0
      reward_scale: 1.0
      reward_clip: false
      kill_reward: 1.0
      kill_loss_penalty: 1.5
      death_penalty: 0.75
      death_count_decrease_reward: 0.75
      hit_reward: 0.01
      hit_count_decrease_penalty: 0.01
      damage_reward: 0.003
      damage_count_decrease_penalty: 0.003
      health_gain_reward: 0.005
      health_loss_penalty: 0.003
      armor_gain_reward: 0.005
      armor_loss_penalty: 0.001
      weapon_preferences: [1.0, 1.0, 5.0, 5.0, 5.0, 10.0]
      weapon_gain_reward_scale: 0.02
      weapon_loss_penalty_scale: 0.01
      ammo_gain_reward_scale: 0.0002
      ammo_loss_penalty_scale: 0.0001
      selected_weapon_hold_reward_scale: 0.0002
      selected_weapon_hold_steps: 5
      hit_delta_cap: 5
      damage_delta_cap: 200
# Override how accepted checkpoints are ordered for this continuing-combat task.
objective:
  # Rank candidates lexicographically using the priorities listed below.
  rank:
  # Prefer the checkpoint with the highest mean monster killcount.
  - max(eval/full/progress/kills/mean)
  # Break remaining ties with the highest single-episode monster killcount.
  - max(eval/full/progress/kills/max)
  # Prefer the earlier checkpoint when kill criteria remain tied.
  - min(leader/checkpoint/step)
# Override the shared settings used while training a policy for this goal.
train:
  # Track native monster frags independently of the selected reward shape.
  episode_progress_fields: [kills]
  # Refine the family-wide rules that can stop training before its timestep cap.
  early_stop:
    # Address inherited early-stop rules by their stable condition names.
    conditions:
      # Treat sustained survival to the native horizon as solving the training task.
      target_reached:
        # Require the latest 100 target-origin episodes to reach the native horizon.
        metric: train/outcome/success/starts/all/rolling/rate/min
        threshold: 1.0
        # Stop after the mature success window proves the training target.
        action: stop
  # Override the shared ViZDoom environment contract used for training.
  environment:
    # Supply arguments for the native vectorized ViZDoom environment.
    env_config:
      # Step 128 independent Deathmatch environments in each training rollout.
      n_envs: 128
      # Reuse these Deathmatch provider arguments in evaluation via the YAML anchor.
      env_args: &deathmatch_env_args
        # Preserve the scenario's native horizon independently of policy frame skip.
        vizdoom_config:
          episode_timeout: 4200
        # Use the measured Beast-3 throughput optimum for native worker concurrency.
        num_threads: 32
        # Keep GraDOOM training and reference ViZDoom evaluation on the certified profile.
        doom_skill: 3
        # Use a compact combat table with simultaneous movement and attack actions.
        use_restricted_actions:
        - []
        - [ATTACK]
        - [MOVE_FORWARD]
        - [MOVE_BACKWARD]
        - [MOVE_LEFT]
        - [MOVE_RIGHT]
        - [TURN_LEFT]
        - [TURN_RIGHT]
        - [SPEED, MOVE_FORWARD]
        - [ATTACK, MOVE_FORWARD]
        - [ATTACK, MOVE_BACKWARD]
        - [ATTACK, MOVE_LEFT]
        - [ATTACK, MOVE_RIGHT]
        - [ATTACK, TURN_LEFT]
        - [ATTACK, TURN_RIGHT]
        - [SELECT_NEXT_WEAPON]
        - [SELECT_PREV_WEAPON]
        # List the native game variables that ViZDoom must collect and expose.
        game_variables:
        - killcount
        - health
        - armor
        - selected_weapon
        - selected_weapon_ammo
        - weapon1
        - weapon2
        - weapon3
        - weapon4
        - weapon5
        - weapon6
        - ammo1
        - ammo2
        - ammo3
        - ammo4
        - ammo5
        - ammo6
        # Configure which per-step information the provider exposes to GradLab.
        info_filter:
          # Control when the selected information keys are emitted.
          mode: all
          # Retain combat state and episode-boundary signals for task logic and playback.
          keys:
          - killcount
          - health
          - armor
          - selected_weapon
          - selected_weapon_ammo
          - weapon1
          - weapon2
          - weapon3
          - weapon4
          - weapon5
          - weapon6
          - ammo1
          - ammo2
          - ammo3
          - ammo4
          - ammo5
          - ammo6
          - player_dead
    # Reuse these Deathmatch task overrides in evaluation via the YAML anchor.
    task: &deathmatch_task
      # Map task-level signal names to keys from the provider's per-step information.
      signals:
        # Map combat counters and player state into stable task-level names.
        kills: killcount
        health: health
        armor: armor
        selected_weapon: selected_weapon
        selected_weapon_ammo: selected_weapon_ammo
        # Preserve slot order so inventory context aligns with weapon-selection semantics.
        weapons_owned: [weapon1, weapon2, weapon3, weapon4, weapon5, weapon6]
        weapon_ammo: [ammo1, ammo2, ammo3, ammo4, ammo5, ammo6]
        player_dead: player_dead
      # Expose action-relevant survivability and weapon state to both policy heads.
      model_inputs:
        schema_version: 1
        context:
          health:
            signal: health
            update: transition
            history: provider_frame_stack
            encoding:
              kind: continuous
              scale: 0.01
              offset: 0.0
              # Saturate fatal overkill at zero and possible Doom over-health at two.
              low: 0.0
              high: 2.0
              clip: true
          armor:
            signal: armor
            update: transition
            history: provider_frame_stack
            encoding:
              kind: continuous
              # Normalize standard Doom armor and saturate any custom over-armor.
              scale: 0.005
              offset: 0.0
              low: 0.0
              high: 1.0
              clip: true
          selected_weapon:
            signal: selected_weapon
            update: transition
            history: provider_frame_stack
            encoding:
              kind: categorical
              # The bundled Deathmatch scenario exposes weapon slots one through six.
              values: [1, 2, 3, 4, 5, 6]
          selected_weapon_ammo:
            signal: selected_weapon_ammo
            update: transition
            history: provider_frame_stack
            encoding:
              kind: continuous
              # Normalize the scenario's largest selected-weapon ammo capacity of 300.
              scale: 0.0033333333333333335
              offset: 0.0
              low: 0.0
              high: 1.0
              clip: true
          weapons_owned:
            signal: weapons_owned
            update: transition
            history: provider_frame_stack
            encoding:
              kind: continuous
              # Encode possession for selectable weapon slots one through six.
              scale: 1.0
              offset: 0.0
              low: 0.0
              high: 1.0
              clip: true
          weapon_ammo:
            signal: weapon_ammo
            update: transition
            history: provider_frame_stack
            encoding:
              kind: continuous
              # Normalize melee, bullet, shell, bullet, rocket, and cell ammo by capacity.
              scale: [1.0, 0.005, 0.02, 0.005, 0.02, 0.0033333333333333335]
              offset: 0.0
              low: 0.0
              high: 1.0
              clip: true
      # Define discrete task events derived from changes in the declared signals.
      events:
        # Detect each monster elimination from an increase in the kill counter.
        monster_killed: {signal: kills, operation: increase}
        # Detect death when the provider's death flag is asserted for a step.
        player_died: {signal: player_dead, operation: equals_for, value: 1, steps: 1}
      # Define which task events end an episode and how each outcome is classified.
      termination:
        # List the events that mark an episode as failed.
        failure: [player_died]
        # Count survival to the provider-native horizon as task success.
        success: [time_limit_reached]
        # Preserve a truncation boundary so the learner bootstraps from the final observation.
        bootstrap: [time_limit_reached]
# Override the shared settings used to evaluate checkpoints for this goal.
eval:
  # Declare every metric threshold a checkpoint must satisfy to be accepted.
  acceptance:
  # Select the evaluation metric tested by this acceptance rule.
  - metric: eval/full/progress/kills/mean
    # Choose how the observed metric is compared with the threshold.
    operator: '>='
    # Require a substantial mean monster killcount across the complete evaluation manifest.
    threshold: 10.0
  # Override the shared ViZDoom environment contract used during evaluation.
  environment:
    # Supply evaluation-time arguments for the native vectorized ViZDoom environment.
    env_config:
      # Reuse the Deathmatch provider arguments declared for training.
      env_args:
        <<: *deathmatch_env_args
        # Preserve the shared 16-lane evaluation capacity.
        num_threads: 16
    # Merge the same Deathmatch task overrides into the shared evaluation defaults.
    task: *deathmatch_task
