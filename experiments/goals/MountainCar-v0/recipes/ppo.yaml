defaults:
- ../../../recipes/_presets/classic-control-ppo@_global_
- _self_
recipe_id: ppo
description: >-
  Gymnasium MountainCar PPO adapted from RL Baselines3 Zoo revision
  f94cef4e59fb2f03b77177db432c3f771d0ee72c without stateful VecNormalize.
train:
  timesteps: 1000000
  early_stop:
    conditions:
      return_plateau:
        metric: train/episode/return/shaped/origin/target/rolling/mean
        trigger: no_improvement
        direction: maximize
        min_delta: 1.0
        delta_mode: absolute
        start_after_steps: 250000
        patience_steps: 250000
        outcome: neutral
        action: stop
  backend:
    config:
      n_steps: 16
      batch_size: 64
      n_epochs: 4
      learning_rate: 3.0e-4
      gamma: 0.99
      gae_lambda: 0.98
