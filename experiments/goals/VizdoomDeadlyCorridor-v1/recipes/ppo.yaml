defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: >-
  Seed {{ seed }} trains PPO from pixels to fight through Deadly Corridor and reach the armor vest,
  with stochastic 100-episode evaluation and checkpoint promotion at 80% completion.
train:
  timesteps: 25000000
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 6250000
        patience_steps: 6250000
