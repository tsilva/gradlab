defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: >-
  Seed {{ seed }} trains PPO from pixels to fight through Deadly Corridor and reach the armor vest,
  until the timestep cap or return plateau. This run is training-only; goal-owned evaluation
  remains available for later explicit use.
train:
  checkpoint_eval_backend: none
  timesteps: 25000000
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 6250000
        patience_steps: 6250000
