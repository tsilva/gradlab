defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: Training-only pixel PPO for fighting through {{ goal_id }}.
train:
  checkpoint_freq: 2500000
  checkpoint_steps: [500000, 1000000]
  checkpoint_candidates:
    metric: train/return/mean
    direction: maximize
    min_delta: 0.05
    delta_mode: relative
    start_after_steps: 500000
    min_interval_steps: 2500000
    max_checkpoints: 3
  checkpoint_eval_backend: none
  timesteps: 25000000
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 6250000
        patience_steps: 6250000
