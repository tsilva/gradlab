# Compose this goal from reusable YAML configuration fragments.
defaults:
# Load the shared ViZDoom goal contract into the global configuration namespace.
- ../_vizdoom-common@_global_
# Apply this file last so corridor-specific values override the shared defaults.
- _self_
# Give the goal a human-readable name for reports and operator-facing views.
title: ViZDoom Deadly Corridor completion
# Override the shared settings used while training a policy for this goal.
train:
  # Refine the family-wide rules that can stop training before its timestep cap.
  early_stop:
    # Address inherited early-stop rules by their stable condition names.
    conditions:
      # Specialize the inherited successful-stop rule for the corridor task.
      target_reached:
        # Select the training metric compared with this condition's threshold.
        metric: train/episode/return/shaped/from/target/window_100/mean
        # Align the training target with this goal's acceptance requirement.
        threshold: 0.80
  # Override the shared ViZDoom environment contract used for training.
  environment:
    # Supply arguments for the native vectorized ViZDoom environment.
    env_config:
      # Reuse these corridor-specific provider arguments in evaluation via the YAML anchor.
      env_args: &deadly_corridor_env_args
        # Preserve the scenario's native horizon independently of policy frame skip.
        vizdoom_config:
          episode_timeout: 2100
        # List the native game variables that ViZDoom must collect and expose.
        game_variables: [armor]
        # Configure which per-step information the provider exposes to GradLab.
        info_filter:
          # Control when the selected information keys are emitted.
          mode: all
          # List the provider information keys retained for task signals.
          keys: [armor, player_dead]
    # Reuse these corridor-specific task overrides in evaluation via the YAML anchor.
    task: &deadly_corridor_task
      # Map task-level signal names to keys from the provider's per-step information.
      signals:
        # Map the task-level armor signal to its provider information key.
        armor: armor
        # Map the task-level death signal to its provider information key.
        player_dead: player_dead
      # Define discrete task events derived from changes in the declared signals.
      events:
        # Detect reaching the goal vest from an increase in armor.
        goal_reached: {signal: armor, operation: increase}
        # Detect death when the provider's death flag is asserted for a step.
        player_died: {signal: player_dead, operation: equals_for, value: 1, steps: 1}
      # Define which task events end an episode and how each outcome is classified.
      termination:
        # List the events that mark an episode as failed.
        failure: [player_died]
        # List the events that mark an episode as successful.
        success: [goal_reached]
        # List provider boundaries treated as timeouts rather than task outcomes.
        timeout: [time_limit_reached]
      # Configure the reward presented to the policy after the inherited native reward is computed.
      reward:
        # Set the positive divisor applied to native rewards before clipping.
        reward_scale: 100.0
# Override the shared settings used to evaluate checkpoints for this goal.
eval:
  # Declare every metric threshold a checkpoint must satisfy to be accepted.
  acceptance:
  # Select the evaluation metric tested by this acceptance rule.
  - metric: eval/full/episode/return/shaped/mean
    # Choose how the observed metric is compared with the threshold.
    operator: '>='
    # Set the shaped-return threshold required for acceptance.
    threshold: 0.80
  # Override the shared ViZDoom environment contract used during evaluation.
  environment:
    # Supply evaluation-time arguments for the native vectorized ViZDoom environment.
    env_config:
      # Reuse the corridor-specific provider arguments declared for training.
      env_args: *deadly_corridor_env_args
    # Merge the same corridor-specific task overrides into the shared evaluation defaults.
    task: *deadly_corridor_task
