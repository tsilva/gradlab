defaults:
- ../_goal-common@_global_
- _self_
goal_id: FirstWall
title: Clear the first Breakout wall
objective:
  training_success:
    metric: train/progress/bricks_destroyed_normalized/mean
    operator: '>='
    threshold: 0.5
train:
  checkpoint_freq: 10000000
  environment:
    task:
      events:
        one_wall_cleared:
          signal: walls_cleared
          operation: equals
          value: 1
      termination:
        success: [one_wall_cleared]
