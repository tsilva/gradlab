train:
  timesteps: 1310720
  policy_model:
    schema_version: 2
    encoder:
      kind: nature_cnn
      features_dim: 512
    fusion:
      hidden_sizes:
      - 256
      activation: tanh
    normalize_images: true
    orthogonal_init: true
  backend:
    id: sb3.a2c
    config:
      n_steps: 128
      learning_rate: 0.0007
      gamma: 0.999
      gae_lambda: 1.0
      ent_coef: 0.01
      vf_coef: 0.5
      normalize_advantage: false
  environment:
    env_provider: env-breakoutatari2600-turbo-native
    preprocessing:
      frame_skip: 2
    env_config:
      env_args:
        info_filter:
          mode: all
          keys:
          - ball_x
          - ball_x_normalized
          - ball_y
          - ball_y_normalized
          - ball_vx
          - ball_vx_normalized
          - ball_vy
          - ball_vy_normalized
          - paddle_x
          - paddle_x_normalized
          - paddle_width
          - paddle_width_normalized
          - ball_paddle_offset
          - ball_paddle_offset_normalized
          - score
          - lives
          - bricks_remaining
          - walls_cleared
        use_restricted_actions:
        - - BUTTON
        - - RIGHT
        - - LEFT
      n_envs: 64
    task:
      signals:
        lives: lives
        policy_ball_x: ball_x_normalized
        policy_ball_y: ball_y_normalized
        policy_ball_vx: ball_vx_normalized
        policy_ball_vy: ball_vy_normalized
        policy_paddle_x: paddle_x_normalized
        policy_paddle_width: paddle_width_normalized
        policy_ball_paddle_offset: ball_paddle_offset_normalized
        policy_paddle_vx: paddle_vx_normalized
        policy_lives: lives_normalized
      events:
        life_loss:
          signal: lives
          operation: decrease
        brick_destroyed:
          signal: bricks_destroyed
          operation: increase
      reward:
        event_rewards:
          life_loss: -0.1
          wall_cleared: 20.0
        reward_mode: events
        event_delta_rewards:
          brick_destroyed: 1.0
      model_inputs:
        schema_version: 1
        context:
          ball_x:
            signal: policy_ball_x
            update: transition
            encoding:
              kind: continuous
              scale: 2.0
              offset: -1.0
              low: null
              high: null
              clip: false
          ball_y:
            signal: policy_ball_y
            update: transition
            encoding:
              kind: continuous
              scale: 2.0
              offset: -1.0
              low: null
              high: null
              clip: false
          ball_vx:
            signal: policy_ball_vx
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          ball_vy:
            signal: policy_ball_vy
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          paddle_x:
            signal: policy_paddle_x
            update: transition
            encoding:
              kind: continuous
              scale: 2.0
              offset: -1.0
              low: null
              high: null
              clip: false
          paddle_vx:
            signal: policy_paddle_vx
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          paddle_width:
            signal: policy_paddle_width
            update: transition
            encoding:
              kind: continuous
              scale: 8.0
              offset: -7.0
              low: null
              high: null
              clip: false
          ball_paddle_offset:
            signal: policy_ball_paddle_offset
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          lives_normalized:
            signal: policy_lives
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
  occupancy:
    cell:
      dimensions:
      - signal: bricks_destroyed_normalized
        bucket_size: 0.125
        clamp:
        - 0
        - 0.49999999999999994
    domains:
    - - 0
      - 1
      - 2
      - 3
    units:
    - two-wall completion fraction
    labels:
    - 0-25% of first wall
    - 25-50% of first wall
    - 50-75% of first wall
    - 75-100% of first wall
    window_transitions: 65536
logging:
  wandb_mode: online
recipe_id: a2c-monitoring-validation
description: Bounded SB3 A2C validation of immutable native Breakout FirstWall checkpoint
  monitoring. Monitoring is enabled only with explicit measured campaign settings
  at launch.
