defaults:
- ../../../../recipes/_presets/breakout-ppo@_global_
- _self_
recipe_id: ppo
description: Default Breakout PPO with scheduled learning-rate reductions, gamma 0.999, and a +20 first-wall completion bonus. The seed123 reference run reached 95/100 stochastic research clears from scratch; held-out 100/100 remains unverified.
# Training settings from gradlab-7d0a6b7fd44d3720c1a82daad90f639d; phase checkpoints are recipe-owned.
train:
  checkpoint_freq: 0
  checkpoint_steps: [5000000, 10000000, 20000000, 40000000, 60000000, 100000000, 140000000, 160000000, 171000000, 173000000, 176500000, 179000000, 185000000]
  checkpoint_candidates:
    metric: train/progress/bricks_destroyed_normalized/mean
    direction: maximize
    min_delta: 0.025
    delta_mode: absolute
    start_after_steps: 5000000
    min_interval_steps: 10000000
    max_checkpoints: 3
  checkpoint_monitoring:
    enabled: false
    episodes: 100
    record_episodes: 50
    contribution_bytes: 30000000000  # 30 GB retained monitoring uploads per Run.
  occupancy:
    cell:
      dimensions:
      - signal: bricks_destroyed_normalized
        # The provider normalizes across two walls; one wall spans [0, 0.5].
        bucket_size: 0.125
        clamp: [0, 0.49999999999999994]
    domains: [[0, 1, 2, 3]]
    units: [two-wall completion fraction]
    labels: [0-25% of first wall, 25-50% of first wall, 50-75% of first wall, 75-100% of first wall]
    window_transitions: 65536
