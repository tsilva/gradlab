defaults:
- ../_goal-common@_global_
- _self_
goal_id: TwoWalls
title: Clear both Breakout walls
objective:
  training_success:
    metric: train/progress/bricks_destroyed_normalized/mean
    operator: '>='
    threshold: 1.0
train:
  environment:
    task:
      events:
        two_walls_cleared:
          signal: walls_cleared
          operation: equals
          value: 2
      termination:
        success: [two_walls_cleared]
