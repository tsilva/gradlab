defaults:
- ../_goal-common@_global_
- _self_
goal_id: TwoWalls
evaluation_mode: evaluated
title: Clear both Breakout walls
objective:
  rank:
  - max(eval/progress/bricks_destroyed_normalized/mean)
  - max(eval/progress/bricks_destroyed_normalized/max)
  - min(eval/episode_steps/mean)
  training_success:
    metric: train/progress/bricks_destroyed_normalized/mean
    operator: '>='
    threshold: 1.0
train:
  checkpoint_freq: 10000000
  environment:
    task:
      events:
        two_walls_cleared:
          signal: walls_cleared
          operation: equals
          value: 2
      termination:
        success: [two_walls_cleared]

eval:
  episodes: 100
  acceptance:
  - metric: eval/progress/bricks_destroyed_normalized/mean
    operator: ">="
    threshold: 1.0
  policy:
    stochastic: true
  environment:
    env_provider: env-breakoutatari2600-turbo-native
    env_config:
      game: Breakout-Atari2600-v0
      state: Start
      n_envs: 8
      env_args:
        scenario: scenario
        info: data
        use_restricted_actions:
        - - BUTTON
        - - RIGHT
        - - LEFT
        record: false
        players: 1
        inttype: stable
        obs_type: image
        render_mode: rgb_array
        info_filter:
          mode: all
          keys:
          - ball_x
          - ball_x_normalized
          - ball_y
          - ball_y_normalized
          - ball_vx
          - ball_vx_normalized
          - ball_vy
          - ball_vy_normalized
          - paddle_x
          - paddle_x_normalized
          - paddle_width
          - paddle_width_normalized
          - ball_paddle_offset
          - ball_paddle_offset_normalized
          - score
          - lives
          - bricks_remaining
          - walls_cleared
        num_threads: 6
        rom_path: null
        obs_copy: safe_view
        obs_grayscale: true
        obs_layout: chw
        frame_stack: 4
        noop_reset_max: 30
        use_fire_reset: false
    preprocessing:
      frame_skip: 2
      max_pool_frames: false
      sticky_action_prob: 0.0
      obs_resize:
      - 84
      - 84
      obs_crop:
      - 17
      - 0
      - 0
      - 0
      obs_crop_mode: mask
      obs_crop_fill: 0
      obs_resize_algorithm: area
    task:
      id: identity
      action:
        set: native
        conditional_overrides:
        - id: auto_serve
          when:
            signal: ball_y
            operation: equals
            value: 0
          replace_with:
            semantic_id: button
      signals:
        ball_y: ball_y
        walls_cleared: walls_cleared
        bricks_remaining: bricks_remaining
        ball_x: ball_x
        paddle_x: paddle_x
        ball_vx: ball_vx
        ball_vy: ball_vy
        score: score
        bricks_destroyed: bricks_destroyed
        bricks_destroyed_normalized: bricks_destroyed_normalized
        lives: lives
        policy_ball_x: ball_x_normalized
        policy_ball_y: ball_y_normalized
        policy_ball_vx: ball_vx_normalized
        policy_ball_vy: ball_vy_normalized
        policy_paddle_x: paddle_x_normalized
        policy_paddle_width: paddle_width_normalized
        policy_ball_paddle_offset: ball_paddle_offset_normalized
        policy_paddle_vx: paddle_vx_normalized
        policy_lives: lives_normalized
      events:
        serve_stall:
          signal: ball_y
          operation: equals_for
          value: 0
          steps: 256
        two_walls_cleared:
          signal: walls_cleared
          operation: equals
          value: 2
        life_loss:
          signal: lives
          operation: decrease
        brick_destroyed:
          signal: bricks_destroyed
          operation: increase
      termination:
        timeout:
        - serve_stall
        max_episode_steps: 54000
        success:
        - two_walls_cleared
      reward:
        reward_mode: events
        reward_scale: 1.0
        reward_clip: false
        event_rewards:
          serve_stall: -5.0
          life_loss: -0.1
          two_walls_cleared: 20.0
        event_delta_rewards:
          brick_destroyed: 1.0
      model_inputs:
        schema_version: 1
        context:
          ball_x:
            signal: policy_ball_x
            update: transition
            encoding:
              kind: continuous
              scale: 2.0
              offset: -1.0
              low: null
              high: null
              clip: false
          ball_y:
            signal: policy_ball_y
            update: transition
            encoding:
              kind: continuous
              scale: 2.0
              offset: -1.0
              low: null
              high: null
              clip: false
          ball_vx:
            signal: policy_ball_vx
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          ball_vy:
            signal: policy_ball_vy
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          paddle_x:
            signal: policy_paddle_x
            update: transition
            encoding:
              kind: continuous
              scale: 2.0
              offset: -1.0
              low: null
              high: null
              clip: false
          paddle_vx:
            signal: policy_paddle_vx
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          paddle_width:
            signal: policy_paddle_width
            update: transition
            encoding:
              kind: continuous
              scale: 8.0
              offset: -7.0
              low: null
              high: null
              clip: false
          ball_paddle_offset:
            signal: policy_ball_paddle_offset
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          lives_normalized:
            signal: policy_lives
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
release:
  huggingface: {}
