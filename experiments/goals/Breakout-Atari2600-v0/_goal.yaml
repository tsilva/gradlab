defaults:
- _self_
goal_id: Breakout-Atari2600-v0
evaluation_mode: training_only
tags:
- "goal_id:{{ goal_id }}"
- "recipe_id:{{ recipe_id }}"
- "env_id:{{ env_id }}"
title: Atari 2600 Breakout wall completion
objective:
  rank:
  - max(train/episode/return/shaped/origin/target/rolling/mean)
  - min(train/global_step)
train:
  checkpoint_freq: 500000
  environment:
    # Breakout Turbo is the default ROM-free implementation. The complete contract is
    # intentionally accepted by Stable Retro Turbo so only env_provider needs to change.
    env_provider: &breakout_provider env-breakoutatari2600-turbo-native
    env_config:
      <<: &breakout_env_config
        game: Breakout-Atari2600-v0
        state: Start
        n_envs: 128
        env_args: &breakout_provider_args
          scenario: scenario
          info: data
          use_restricted_actions: simple
          record: false
          players: 1
          inttype: stable
          obs_type: image
          render_mode: rgb_array
          info_filter: all
          num_threads: 6
          rom_path: null
          obs_copy: safe_view
          obs_grayscale: true
          obs_layout: chw
          frame_stack: 4
          # Sample up to 30 reset noops across equivalent Breakout providers.
          noop_reset_max: 30
          use_fire_reset: false
    preprocessing: &breakout_preprocessing
      frame_skip: 4
      max_pool_frames: false
      sticky_action_prob: 0.0
      obs_resize: [84, 84]
      # Mask the score band and separator while preserving the wall from source row 17.
      obs_crop: [17, 0, 0, 0]
      obs_crop_mode: mask
      obs_crop_fill: 0
      obs_resize_algorithm: area
    task: &breakout_task
      id: identity
      action:
        # GradLab normalizes both providers to 0=NOOP, 1=FIRE, 2=RIGHT, 3=LEFT.
        set: native
        conditional_overrides:
        - id: auto_serve
          when:
            signal: ball_y
            operation: equals
            value: 0
          replace_with:
            # Stable Retro names the Atari controller trigger BUTTON; in Breakout
            # this is the FIRE action that launches the waiting ball.
            semantic_id: button
      signals:
        ball_y: ball_y
        walls_cleared: walls_cleared
        bricks_remaining: bricks_remaining
        ball_x: ball_x
        paddle_x: paddle_x
        ball_vx: ball_vx
        ball_vy: ball_vy
        # The live-state curriculum groups reachable Breakout states by score stage.
        score: score
      events:
        serve_stall:
          signal: ball_y
          operation: equals_for
          value: 0
          # One policy step is four native frames; 256 steps is roughly 17 seconds.
          steps: 256
      termination:
        # Waiting to serve remains recoverable with FIRE; truncate so
        # actor-critic backends bootstrap from the final waiting state.
        timeout: [serve_stall]
        max_episode_steps: 54000
      reward:
        reward_mode: native
        reward_scale: 1.0
        reward_clip: false
        event_rewards:
          serve_stall: -5.0
