defaults:
- ../../../recipes/_presets/breakout-ball-state-ablation-ppo@_global_
- _self_
recipe_id: ppo-ball-state
description: Native Breakout PPO with ball state and width-aware paddle geometry fused after the visual encoder.
train:
  environment:
    task:
      model_inputs:
        schema_version: 1
        context:
          ball_x:
            signal: policy_ball_x
            update: transition
            encoding:
              kind: continuous
              scale: 2.0
              offset: -1.0
              # Provider ratios deliberately preserve off-viewport values.
              low: null
              high: null
              clip: false
          ball_y:
            signal: policy_ball_y
            update: transition
            encoding:
              kind: continuous
              scale: 2.0
              offset: -1.0
              low: null
              high: null
              clip: false
          ball_vx:
            signal: policy_ball_vx
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          ball_vy:
            signal: policy_ball_vy
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
          paddle_x:
            signal: policy_paddle_x
            update: transition
            encoding:
              kind: continuous
              scale: 2.0
              offset: -1.0
              low: null
              high: null
              clip: false
          paddle_width:
            signal: policy_paddle_width
            update: transition
            encoding:
              kind: continuous
              # Center the provider's narrow/wide ratios: 0.75 -> -1, 1 -> 1.
              scale: 8.0
              offset: -7.0
              low: null
              high: null
              clip: false
          ball_paddle_offset:
            signal: policy_ball_paddle_offset
            update: transition
            encoding:
              kind: continuous
              scale: 1.0
              offset: 0.0
              low: null
              high: null
              clip: false
