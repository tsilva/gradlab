defaults:
- ../../../recipes/_presets/breakout-high-throughput-ppo@_global_
- _self_
recipe_id: ppo
description: High-throughput PPO for {{ goal_id }} with learning-rate and entropy decay plus five-point life-loss and serve-stall penalties.
train:
  environment:
    task:
      signals:
        lives: lives
      events:
        life_loss:
          signal: lives
          operation: decrease
      reward:
        event_rewards:
          life_loss: -5.0
