defaults:
- ../../../recipes/_presets/breakout-ball-state-ablation-ppo@_global_
- _self_
recipe_id: ppo
description: Default Breakout PPO with scheduled learning-rate reductions, gamma 0.999, and a +20 first-wall completion bonus. The seed123 reference run reached 95/100 stochastic research clears from scratch; held-out 100/100 remains unverified.
# Training settings from gradlab-7d0a6b7fd44d3720c1a82daad90f639d; checkpoint cadence remains goal-owned.
train:
  timesteps: 191561728
  occupancy:
    cell:
      dimensions:
      - signal: bricks_destroyed_normalized
        # The provider normalizes across two walls; one wall spans [0, 0.5].
        bucket_size: 0.125
        clamp: [0, 0.49999999999999994]
    domains: [[0, 1, 2, 3]]
    units: [two-wall completion fraction]
    labels: [0-25% of first wall, 25-50% of first wall, 50-75% of first wall, 75-100% of first wall]
    window_transitions: 65536
  backend:
    id: gradlab.ppo
    config:
      batch_size: 512
      gamma: 0.999
      gae_lambda: 0.95
      n_steps: 128
      learning_rate: 0.00025
      learning_rate_final: null
      learning_rate_schedule_timesteps: 0
      learning_rate_milestones:
      - {step: 40001536, value: 5.0e-05}
      - {step: 171016192, value: 5.0e-05}
      - {step: 171024384, value: 2.5e-05}
      - {step: 171540480, value: 2.5e-05}
      - {step: 171548672, value: 1.0e-05}
      - {step: 176545792, value: 1.0e-05}
      - {step: 176553984, value: 5.0e-06}
  environment:
    env_config:
      n_envs: 64
    task:
      signals:
        policy_paddle_vx: paddle_vx_normalized
        policy_lives: lives_normalized
      model_inputs:
        schema_version: 1
        context:
          ball_x:
            signal: policy_ball_x
            update: transition
            encoding: {kind: continuous, scale: 2.0, offset: -1.0, low: null, high: null, clip: false}
          ball_y:
            signal: policy_ball_y
            update: transition
            encoding: {kind: continuous, scale: 2.0, offset: -1.0, low: null, high: null, clip: false}
          ball_vx:
            signal: policy_ball_vx
            update: transition
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
          ball_vy:
            signal: policy_ball_vy
            update: transition
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
          paddle_x:
            signal: policy_paddle_x
            update: transition
            encoding: {kind: continuous, scale: 2.0, offset: -1.0, low: null, high: null, clip: false}
          paddle_vx:
            signal: policy_paddle_vx
            update: transition
            # Signed last-native-frame displacement / screen width; preserve inertia and edge clamping.
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
          paddle_width:
            signal: policy_paddle_width
            update: transition
            encoding: {kind: continuous, scale: 8.0, offset: -7.0, low: null, high: null, clip: false}
          ball_paddle_offset:
            signal: policy_ball_paddle_offset
            update: transition
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
          lives_normalized:
            signal: policy_lives
            update: transition
            encoding: {kind: continuous, scale: 1.0, offset: 0.0, low: null, high: null, clip: false}
      events:
        brick_destroyed:
          signal: bricks_destroyed
          operation: increase
        one_wall_cleared:
          signal: walls_cleared
          operation: equals
          value: 1
      termination:
        # Clearing the first wall ends the episode without value bootstrapping.
        success: [one_wall_cleared]
      reward:
        # Exclude native score; retain inherited life-loss and serve-stall rewards.
        reward_mode: events
        event_delta_rewards:
          brick_destroyed: 1.0
        event_rewards:
          one_wall_cleared: 20.0
