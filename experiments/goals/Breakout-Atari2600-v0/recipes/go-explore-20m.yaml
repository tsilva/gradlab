defaults:
- _self_
recipe_id: go-explore-20m
description: >-
  Seed {{ seed }} runs Go-Explore trajectory discovery for {{ goal_id }} with
  YAML-defined Breakout frontier cells, an ephemeral local state archive, and
  a 20 million-transition search limit.
train:
  timesteps: 20000000
  state_archive:
    semantic_id: state-archive-v1
    persistence: ephemeral
    restore_semantics: continuation
    recorder:
      mode: backend
      cell:
        dimensions:
        - {signal: walls_cleared, bucket_size: 1}
        # Within a coarse progress band, Go-Explore retains the higher-return
        # representative, so exact per-brick cells add fragmentation without
        # preserving a better frontier.
        - {signal: bricks_remaining, bucket_size: 6}
        # Breakout Turbo exposes X coordinates in signed 16.16 fixed-point
        # units. Keep the ball at eight-pixel resolution and the wider paddle
        # at sixteen-pixel resolution.
        - {signal: ball_x, bucket_size: 524288}
        - {signal: ball_y, bucket_size: 8}
        - {signal: paddle_x, bucket_size: 1048576}
        # Direction affects future geometry; exact fixed-point speed does not
        # need a separate frontier cell. Clamp maps each velocity to -1, 0, 1.
        - {signal: ball_vx, bucket_size: 1, clamp: [-1, 1]}
        - {signal: ball_vy, bucket_size: 1, clamp: [-1, 1]}
    export:
      snapshots: none
    curriculum: null
  backend:
    id: gradlab.go-explore
    config:
      # Mix broad archive novelty with frequent attempts to extend the
      # highest-scoring trajectory. Shorter segments create twice as many
      # opportunities to restore and branch from that frontier.
      explore_steps: 64
      progress_guided_restore_probability: 0.5
      success_guided_restore_probability: 0.5
      run_duration_mean: 4.0
      run_duration_max: 32
      fallback_action: noop
      progress_signal: score
      log_interval_steps: 10000
      compaction_interval_steps: 250000
logging:
  wandb: true
  wandb_mode: online
