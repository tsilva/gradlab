defaults:
- ../../../recipes/_presets/breakout-high-throughput-ppo@_global_
- _self_
recipe_id: ppo-serve-wait-20m
description: 20M-transition high-throughput PPO for {{ goal_id }} with five-point life-loss and serve-stall penalties plus a 0.01 penalty on every pre-serve transition.
train:
  timesteps: 20000000
  environment:
    task:
      signals:
        lives: lives
      events:
        life_loss:
          signal: lives
          operation: decrease
        serve_wait:
          signal: ball_y
          operation: equals
          value: 0
      reward:
        event_rewards:
          life_loss: -5.0
          serve_wait: -0.01
