defaults:
- ../../../recipes/_presets/breakout-high-throughput-ppo@_global_
- _self_
recipe_id: ppo-archive-curriculum
description: High-throughput PPO for {{ goal_id }} with a score-staged live-state curriculum.
train:
  state_archive:
    semantic_id: state-archive-v1
    persistence: durable
    restore_semantics: continuation
    recorder:
      mode: cell_transition
      cell:
        dimensions:
        - {signal: score, bucket_size: 50}
    curriculum:
      archive_share: 0.20
      priority_metric: value_error
      restore_entries: true
