defaults:
- ../../../recipes/_presets/breakout-high-throughput-ppo@_global_
- _self_
recipe_id: ppo-archive-curriculum
description: >-
  Seed {{ seed }} trains the default high-throughput Breakout PPO policy for {{ goal_id }} while reserving
  approximately 20 percent of lanes for a bounded live-state curriculum keyed by 50-point score
  stages and prioritized by value error plus staleness.
train:
  state_archive:
    semantic_id: state-archive-v1
    persistence: durable
    restore_semantics: continuation
    recorder:
      mode: cell_transition
      cell:
        signal: score
        bucket_size: 50
    curriculum:
      archive_share: 0.20
      priority_metric: value_error
      restore_entries: true
