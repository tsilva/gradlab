defaults:
- ../_vizdoom-common@_global_
- _self_
title: ViZDoom Basic monster elimination
train:
  checkpoint_freq: 100000
  early_stop:
    conditions:
      target_reached:
        metric: train/episode/return/shaped/from/target/window_100/mean
        threshold: 0.95
  environment:
    env_config:
      env_args: &basic_env_args
        info_filter:
          mode: all
          keys: [killcount]
        game_variables: [KILLCOUNT]
    task: &basic_task
      signals:
        kills: killcount
      events:
        monster_killed:
          signal: kills
          operation: increase
      termination:
        success: [monster_killed]
        max_episode_steps: 72
      reward:
        reward_scale: 100.0
eval:
  acceptance:
  - metric: eval/full/episode/return/mean
    operator: '>='
    threshold: 0.95
  environment:
    env_config:
      env_args: *basic_env_args
    task: *basic_task
