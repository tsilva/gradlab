defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: Training-only pixel PPO for gathering health in {{ goal_id }}.
train:
  checkpoint_eval_backend: none
  timesteps: 20000000
  # Fuse health and remaining time through one nonlinear actor-critic trunk.
  policy_model:
    schema_version: 2
    encoder:
      kind: nature_cnn
      features_dim: 512
    fusion: {hidden_sizes: [256], activation: tanh}
    normalize_images: true
    orthogonal_init: true
  backend:
    config:
      n_steps: 256
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 5000000
        patience_steps: 5000000
