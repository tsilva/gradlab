defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: >-
  Seed {{ seed }} trains PPO from pixels to gather health in the Supreme layout and survive 512
  policy steps, with stochastic 100-episode evaluation and promotion at 95% survival.
train:
  timesteps: 20000000
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 5000000
        patience_steps: 5000000
