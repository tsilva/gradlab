defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: >-
  Seed {{ seed }} trains PPO from pixels to gather health in the Supreme layout and survive 512
  policy steps until the training target, timestep cap, or return plateau. This run is training-only;
  goal-owned evaluation remains available for later explicit use.
train:
  checkpoint_eval_backend: none
  timesteps: 20000000
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 5000000
        patience_steps: 5000000
