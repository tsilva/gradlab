defaults:
- ../../../recipes/_presets/atari-ppo@_global_
- _self_
recipe_id: ppo
description: >-
  Seed {{ seed }} trains PPO from pixels to defend the line and maximize native combat return,
  with stochastic 100-episode evaluation and promotion at a mean return of at least 5.
train:
  timesteps: 10000000
  early_stop:
    conditions:
      return_plateau:
        start_after_steps: 2500000
        patience_steps: 2500000
