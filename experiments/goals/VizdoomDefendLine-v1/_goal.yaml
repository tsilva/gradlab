# Compose this goal from reusable YAML configuration fragments.
defaults:
# Load the shared ViZDoom goal contract into the global configuration namespace.
- ../_vizdoom-common@_global_
# Apply this file last so line-defense values override the shared defaults.
- _self_
# Give the goal a human-readable name for reports and operator-facing views.
title: ViZDoom Defend the Line combat
# Override how accepted checkpoints are ordered for this continuing-combat task.
objective:
  # Rank candidates lexicographically using the priorities listed below.
  rank:
  # Prefer the checkpoint with the highest mean shaped evaluation return.
  - max(eval/full/episode/return/shaped/mean)
  # Break remaining ties with the highest single-episode shaped return.
  - max(eval/full/episode/return/shaped/max)
  # Prefer the earlier checkpoint when return criteria remain tied.
  - min(leader/checkpoint/step)
# Override the shared settings used while training a policy for this goal.
train:
  # Refine the family-wide rules that can stop training before its timestep cap.
  early_stop:
    # Address inherited early-stop rules by their stable condition names.
    conditions:
      # Specialize the inherited successful-stop rule for line defense.
      target_reached:
        # Select the training metric compared with this condition's threshold.
        metric: train/outcome/success/starts/all/rolling/rate/min
        # Require every episode in the mature rolling window to reach the native horizon.
        threshold: 1.0
        # Stop training after the policy sustains a perfect rolling success rate.
        action: stop
  # Override the shared ViZDoom environment contract used for training.
  environment:
    # Supply arguments for the native vectorized ViZDoom environment.
    env_config:
      # Reuse these line-defense provider arguments in evaluation via the YAML anchor.
      env_args: &defend_line_env_args
        # Give every frame-skip variant the same provider-native 2,100-tic horizon.
        vizdoom_config:
          episode_timeout: 2100
        # List the native game variables that ViZDoom must collect and expose.
        game_variables: [killcount]
        # Configure which per-step information the provider exposes to GradLab.
        info_filter:
          # Control when the selected information keys are emitted.
          mode: all
          # List the provider information keys retained for task signals.
          keys: [killcount, player_dead]
    # Reuse these line-defense task overrides in evaluation via the YAML anchor.
    task: &defend_line_task
      # Map task-level signal names to keys from the provider's per-step information.
      signals:
        # Map the task-level kill signal to its provider information key.
        kills: killcount
        # Map the task-level death signal to its provider information key.
        player_dead: player_dead
      # Define discrete task events derived from changes in the declared signals.
      events:
        # Detect each monster elimination from an increase in the kill counter.
        monster_killed: {signal: kills, operation: increase}
        # Detect death when the provider's death flag is asserted for a step.
        player_died: {signal: player_dead, operation: equals_for, value: 1, steps: 1}
      # Define which task events end an episode and how each outcome is classified.
      termination:
        # List the events that mark an episode as failed.
        failure: [player_died]
        # Treat surviving the complete native horizon as successful line defense.
        success: [time_limit_reached]
# Override the shared settings used to evaluate checkpoints for this goal.
eval:
  # Declare every metric threshold a checkpoint must satisfy to be accepted.
  acceptance:
  # Select the evaluation metric tested by this acceptance rule.
  - metric: eval/full/episode/return/shaped/mean
    # Choose how the observed metric is compared with the threshold.
    operator: '>='
    # Set the mean shaped-return threshold required for acceptance.
    threshold: 5.0
  # Override the shared ViZDoom environment contract used during evaluation.
  environment:
    # Supply evaluation-time arguments for the native vectorized ViZDoom environment.
    env_config:
      # Reuse the line-defense provider arguments declared for training.
      env_args: *defend_line_env_args
    # Merge the same line-defense task overrides into the shared evaluation defaults.
    task: *defend_line_task
