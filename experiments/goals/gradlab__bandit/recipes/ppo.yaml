recipe_id: ppo
description: PPO smoke test for the ROM-free native-vector {{ goal_id }} target.
train:
  timesteps: 256
  policy_model:
    schema_version: 1
    topology:
      kind: shared_encoder
      encoder: {kind: flatten}
    fusion: post_encoder_concat
    context_encoders: {}
    routes: {}
    heads:
      action: {hidden_sizes: [64, 64], activation: tanh}
      state_value: {hidden_sizes: [64, 64], activation: tanh}
    normalize_images: true
    orthogonal_init: true
  backend:
    id: sb3.ppo
    config:
      n_steps: 8
      batch_size: 64
      n_epochs: 4
      learning_rate: 0.01
      ent_coef: 0.0
      gamma: 1.0
      gae_lambda: 1.0
      clip_range: 0.2
      vf_coef: 0.5
      adam_eps: 1.0e-05
      normalize_advantage: true
logging:
  wandb_mode: online
