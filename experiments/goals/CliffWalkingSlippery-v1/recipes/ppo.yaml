defaults:
- ../../../recipes/_presets/gymnasium-discrete-ppo@_global_
- _self_
recipe_id: ppo
description: Gymnasium CliffWalkingSlippery-v1 PPO baseline for stochastic transitions.
train:
  timesteps: 1000000
  early_stop:
    conditions:
      return_target:
        metric: train/episode/return/shaped/origin/target/rolling/mean
        trigger: threshold
        operator: '>='
        threshold: -75.0
        start_after_steps: 100000
        patience_steps: 0
        outcome: success
        action: stop
      return_plateau:
        metric: train/episode/return/shaped/origin/target/rolling/mean
        trigger: no_improvement
        direction: maximize
        min_delta: 1.0
        delta_mode: absolute
        start_after_steps: 250000
        patience_steps: 250000
        outcome: neutral
        action: stop
  backend:
    config:
      n_steps: 256
      batch_size: 512
      n_epochs: 10
      learning_rate: 3.0e-4
      gamma: 0.999
      gae_lambda: 0.95
      ent_coef: 0.02
