deployment:
  environment_name: gradlab-eval
  app_name_prefix: gradlab-eval-v3
  function_name: evaluate_checkpoint
resources:
  cpu: 8.0
  memory_mib: 4096
  min_containers: 0
  buffer_containers: 0
  max_containers: 10
  single_use_containers: false
  scaledown_window_seconds: 60
  startup_timeout_seconds: 120
timeouts:
  worker_seconds: 3600
  acceptance_seconds: 1200
  child_margin_seconds: 60
  expiry_margin_seconds: 900
protocol:
  max_attempts: 2
