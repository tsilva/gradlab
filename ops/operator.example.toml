schema_version = 1

# Non-sensitive operator metadata. Copy this file to:
#   ~/.config/rlab/operator.toml
[environment]
DSTACK_SERVER_URL = "http://127.0.0.1:3000"
WANDB_ENTITY = "<wandb-entity>"
RLAB_CONTROL_R2_URI = "s3://<control-bucket>"
RLAB_CONTROL_R2_ENDPOINT_URL = "https://<account-id>.r2.cloudflarestorage.com"
RLAB_CONTROL_R2_REGION = "auto"
RLAB_EVAL_R2_URI = "s3://<evaluation-bucket>"
RLAB_EVAL_R2_ENDPOINT_URL = "https://<account-id>.r2.cloudflarestorage.com"
RLAB_EVAL_R2_REGION = "auto"
RLAB_MODELS_R2_URI = "s3://<models-bucket>"
RLAB_MODELS_R2_ENDPOINT_URL = "https://<account-id>.r2.cloudflarestorage.com"
RLAB_MODELS_R2_REGION = "auto"
RLAB_MODELS_R2_PUBLIC_BASE_URL = "https://<public-bucket-id>.r2.dev"

# Secret values stay in macOS Keychain. These entries contain references only.
[keychain.DSTACK_TOKEN]
service = "rlab-dstack-admin"
account = "<operator-account>"

[keychain.WANDB_API_KEY]
service = "rlab-wandb"
account = "api-key"

[keychain.RLAB_CONTROL_R2_ACCESS_KEY_ID]
service = "rlab-r2-control"
account = "access-key-id"

[keychain.RLAB_CONTROL_R2_SECRET_ACCESS_KEY]
service = "rlab-r2-control"
account = "secret-access-key"

[keychain.RLAB_EVAL_R2_ACCESS_KEY_ID]
service = "rlab-r2-eval"
account = "access-key-id"

[keychain.RLAB_EVAL_R2_SECRET_ACCESS_KEY]
service = "rlab-r2-eval"
account = "secret-access-key"

[keychain.RLAB_MODELS_R2_ACCESS_KEY_ID]
service = "rlab-r2-models"
account = "access-key-id"

[keychain.RLAB_MODELS_R2_SECRET_ACCESS_KEY]
service = "rlab-r2-models"
account = "secret-access-key"

# Modal remains the source of truth for its own token. rlab imports the active
# profile in memory and requires this credential file to use mode 0600.
[modal]
path = "~/.modal.toml"
