schema_version = 3

# Non-sensitive operator metadata. Copy this file to:
#   ~/.config/gradlab/operator.toml
[environment]
WANDB_ENTITY = "<wandb-entity>"
# A private route reachable from the selected training host and operator machine.
# Enroll only fleets with a verified private route and capacity.
MLFLOW_TRACKING_URI = "https://<private-mlflow-host>"
# Logical destination identity is frozen in each MLflow Run manifest.
MLFLOW_OPERATOR_PROFILE = "<private-mlflow-profile>"
# Exact configured dstack fleet IDs permitted to reach the private service.
MLFLOW_ALLOWED_FLEETS = "<approved-fleet-id>"
# basic (default) requires the writer username/password references below.
# network is explicit: private HTTPS, network access controls, no basic credentials.
MLFLOW_AUTH_MODE = "basic"
# Optional for a private CA: base64 of its single PEM certificate.
# GRADLAB_MLFLOW_TLS_CA_B64 = "<base64-pem-ca-certificate>"
GRADLAB_CONTROL_R2_URI = "s3://<control-bucket>"
GRADLAB_CONTROL_R2_ENDPOINT_URL = "https://<account-id>.r2.cloudflarestorage.com"
GRADLAB_CONTROL_R2_REGION = "auto"
GRADLAB_EVAL_R2_URI = "s3://<evaluation-bucket>"
GRADLAB_EVAL_R2_ENDPOINT_URL = "https://<account-id>.r2.cloudflarestorage.com"
GRADLAB_EVAL_R2_REGION = "auto"
GRADLAB_MODELS_R2_URI = "s3://<models-bucket>"
GRADLAB_MODELS_R2_ENDPOINT_URL = "https://<account-id>.r2.cloudflarestorage.com"
GRADLAB_MODELS_R2_REGION = "auto"
GRADLAB_MODELS_R2_PUBLIC_BASE_URL = "https://<public-bucket-id>.r2.dev"

# Coordinator metadata is explicit so each fleet has exactly one control plane.
# The selected coordinator token is resolved lazily from its Infisical reference.
# Optional ssh_tunnel metadata lets the CLI reach a loopback-only coordinator
# from the operator machine. Destinations are tried in order and must all name
# the same coordinator host (for example, LAN first and private VPN second).
[dstack]
default_coordinator = "primary"
default_fleet = "primary-gpu"

[dstack.coordinators.primary]
project = "<dstack-project>"
server_url = "http://127.0.0.1:3000"
token = { instance = "https://app.infisical.com", project_id = "<project-id>", secret_name = "DSTACK_PRIMARY_TOKEN", environment = "prod", path = "/dstack" }
ssh_tunnel = { destinations = ["<ssh-user>@<primary-host>.local", "<ssh-user>@<primary-host-vpn>"], remote_host = "127.0.0.1", remote_port = 3000 }

[dstack.coordinators.secondary]
project = "<dstack-project>"
server_url = "http://127.0.0.1:3002"
token = { instance = "https://app.infisical.com", project_id = "<project-id>", secret_name = "DSTACK_SECONDARY_TOKEN", environment = "prod", path = "/dstack" }
ssh_tunnel = { destinations = ["<ssh-user>@<secondary-host>.local", "<ssh-user>@<secondary-host-vpn>"], remote_host = "127.0.0.1", remote_port = 3000 }

[dstack.fleets.primary-gpu]
coordinator = "primary"
cpu = 12
memory = "40GB"
gpu = "1"
disk = "50GB"

[dstack.fleets.secondary-gpu]
coordinator = "secondary"
cpu = 12
memory = "28GB"
gpu = "1"
disk = "50GB"

# Secret values stay in Infisical. These entries contain references only.

[infisical.WANDB_API_KEY]
instance = "https://app.infisical.com"
project_id = "<project-id>"
secret_name = "WANDB_API_KEY"
environment = "prod"
path = "/wandb"

# Omit both MLflow credential entries when using network authentication.
[infisical.MLFLOW_TRACKING_USERNAME]
instance = "https://app.infisical.com"
project_id = "<project-id>"
secret_name = "MLFLOW_TRACKING_USERNAME"
environment = "prod"
path = "/mlflow"

[infisical.MLFLOW_TRACKING_PASSWORD]
instance = "https://app.infisical.com"
project_id = "<project-id>"
secret_name = "MLFLOW_TRACKING_PASSWORD"
environment = "prod"
path = "/mlflow"

[keychain.GRADLAB_CONTROL_R2_ACCESS_KEY_ID]
service = "gradlab-r2-control"
account = "access-key-id"

[keychain.GRADLAB_CONTROL_R2_SECRET_ACCESS_KEY]
service = "gradlab-r2-control"
account = "secret-access-key"

[keychain.GRADLAB_EVAL_R2_ACCESS_KEY_ID]
service = "gradlab-r2-eval"
account = "access-key-id"

[keychain.GRADLAB_EVAL_R2_SECRET_ACCESS_KEY]
service = "gradlab-r2-eval"
account = "secret-access-key"

[keychain.GRADLAB_MODELS_R2_ACCESS_KEY_ID]
service = "gradlab-r2-models"
account = "access-key-id"

[keychain.GRADLAB_MODELS_R2_SECRET_ACCESS_KEY]
service = "gradlab-r2-models"
account = "secret-access-key"

# Modal credentials are also fetched in memory from Infisical.
[infisical.MODAL_TOKEN_ID]
instance = "https://app.infisical.com"
project_id = "<personal-tooling-project-id>"
secret_name = "MODAL_TOKEN_ID"
environment = "prod"
path = "/modal"

[infisical.MODAL_TOKEN_SECRET]
instance = "https://app.infisical.com"
project_id = "<personal-tooling-project-id>"
secret_name = "MODAL_TOKEN_SECRET"
environment = "prod"
path = "/modal"
