type: task
name: gradlab-local-smoke
image: nvidia/cuda@sha256:<immutable-digest>
commands:
  - nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  - test "$DSTACK_GPUS_NUM" = "1"
resources:
  cpu: 1..
  memory: 1GB..
  gpu: 1
  disk: 10GB..
fleets:
  - <local-fleet>
creation_policy: reuse
max_duration: 5m
stop_duration: 1m
retry:
  on_events:
    - no-capacity
    - interruption
  duration: 10m
tags:
  managed-by: gradlab
  purpose: local-smoke
