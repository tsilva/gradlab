[Service]
# dstack 0.20.28 probes /dev/kfd before /dev/nvidiactl. On an affected
# NVIDIA host, an unused AMD iGPU can therefore mask the training GPU.
# Install this only when GradLab does not schedule AMD compute on that host.
# Remove the compute node before each probe and regenerate host inventory.
ExecStartPre=-/usr/bin/rm -f /dev/kfd
ExecStartPre=-/usr/bin/rm -f /root/.dstack/host_info.json
