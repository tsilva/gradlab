type: task
name: gradlab-cpu-smoke
image: ghcr.io/tsilva/gradlab/gradlab-train@sha256:<exact-source-runtime-digest>
commands:
  - >-
    python -c "import torch;
    assert not torch.cuda.is_available(), 'CPU worker unexpectedly exposes CUDA';
    torch.set_num_threads(1);
    model = torch.nn.Linear(4, 2).to('cpu');
    optimizer = torch.optim.SGD(model.parameters(), lr=0.01);
    before = model.weight.detach().clone();
    model(torch.ones(8, 4)).square().mean().backward();
    optimizer.step();
    assert not torch.equal(before, model.weight.detach());
    print('cpu_learning_update=ok')"
  - gradlab-container-smoke
resources:
  cpu: <minimum-cpu-count>
  memory: <minimum-memory>
  gpu: 0
  disk: <minimum-disk>
fleets:
  - <local-cpu-fleet>
creation_policy: reuse
max_duration: 10m
stop_duration: 1m
retry:
  on_events:
    - no-capacity
    - interruption
  duration: 10m
tags:
  managed-by: gradlab
  purpose: cpu-smoke
