[project]
name = "gradlab"
version = "0.2.0"
description = "Generic reinforcement-learning lab for training and evaluating game agents"
readme = "README.md"
requires-python = "==3.14.*"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "env-stableretro-turbo==1.0.1.post44; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "env-stableretro-turbo==1.0.1.post44; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "env-supermariobrosnes-turbo-emu==0.7.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "env-supermariobrosnes-turbo-emu==0.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "env-breakoutatari2600-turbo-native==0.5.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "env-breakoutatari2600-turbo-native==0.5.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "env-vizdoom-turbo==1.3.0.post27; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "env-vizdoom-turbo==1.3.0.post27; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "env-doom-turbo-torch==0.1.0a4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "env-doom-turbo-torch==0.1.0a4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "stable-baselines3>=2.3,<3",
    "gymnasium>=1.2,<1.3",
    "box2d-py==2.3.5",
    "pygame-ce>=2.5,<3",
    "ale-py>=0.12,<0.13",
    "opencv-python>=4.13,<5",
    "torch==2.13.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorboard>=2.16,<3",
    "wandb>=0.18,<0.23",
    "wandb-workspaces>=0.4,<0.5",
    "boto3>=1.34,<2",
    "certifi>=2026.5.20",
    "pyyaml>=6,<7",
    "omegaconf>=2.3,<3",
    "huggingface-hub>=1.0,<2",
    "jinja2>=3.1,<4",
    "pydantic>=2.13,<3",
    "captum>=0.9,<1",
    "numba>=0.65.1,<0.66",
    "modal>=1.3,<2",
    "rich>=15,<16",
    "tqdm>=4.67,<5",
    "textual>=8.2.8,<9",
    "aiohttp>=3.14.3,<4",
    "pillow>=12.3,<13",
]

[project.scripts]
gradlab = "gradlab.main:main"

[project.optional-dependencies]
dataset = [
    "datasets>=5,<6",
    "pillow>=12.3,<13",
]
dataset-minari = [
    "datasets>=5,<6",
    "pillow>=12.3,<13",
    "minari>=0.5,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gradlab"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"
"METRICS.md" = "gradlab/METRICS.md"
"experiments/goals" = "gradlab/experiments/goals"
"experiments/recipes" = "gradlab/experiments/recipes"

[tool.hatch.build.targets.sdist]
include = [
    "/src/gradlab",
    "/experiments/goals",
    "/experiments/recipes",
    "/README.md",
    "/LICENSE",
    "/METRICS.md",
    "/THIRD_PARTY_NOTICES.md",
]

[tool.uv]
exclude-newer = "7 days"
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
constraint-dependencies = [
    "mistralai!=2.4.6",
    "guardrails-ai!=0.10.1",
    "cryptography>=50",
    "gitpython>=3.1.58",
    "h2>=4.4.1",
    "setuptools>=83",
]
[tool.uv.exclude-newer-package]
env-breakoutatari2600-turbo-native = false
env-doom-turbo-torch = false
env-stableretro-turbo = false
env-supermariobrosnes-turbo-emu = false
env-vizdoom-turbo = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15,<0.16",
]
release = [
    "twine>=6,<7",
]
modal-deploy = [
    "jinja2>=3.1,<4",
    "modal>=1.3,<2",
    "omegaconf>=2.3,<3",
    "pydantic>=2.13,<3",
]
train-image-build = [
    "packaging>=25,<27",
]
train-runtime = [
    "env-stableretro-turbo==1.0.1.post44; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "env-supermariobrosnes-turbo-emu==0.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "env-breakoutatari2600-turbo-native==0.5.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "env-vizdoom-turbo==1.3.0.post27; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "env-doom-turbo-torch==0.1.0a4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "stable-baselines3>=2.3,<3",
    "gymnasium>=1.2,<1.3",
    "box2d-py==2.3.5",
    "pygame-ce>=2.5,<3",
    "ale-py>=0.12,<0.13",
    "opencv-python>=4.13,<5",
    "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorboard>=2.16,<3",
    "pillow>=12.3,<13",
    "rich>=15,<16",
    "tqdm>=4.67,<5",
    "wandb>=0.18,<0.23",
    "boto3>=1.34,<2",
    "certifi>=2026.5.20",
    "pyyaml>=6,<7",
    "huggingface-hub>=1.0,<2",
    "captum>=0.9,<1",
    "numba>=0.65.1,<0.66",
    "modal>=1.3,<2",
    "omegaconf>=2.3,<3",
]
