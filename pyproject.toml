[project]
name = "gradlab"
version = "0.1.1"
description = "Generic reinforcement-learning lab for training and evaluating game agents"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "stable-retro-turbo==1.0.1.post37; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "stable-retro-turbo==1.0.1.post37; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "supermariobrosnes-turbo==0.6.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "supermariobrosnes-turbo==0.6.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "breakout-turbo-env==0.5.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "breakout-turbo-env==0.5.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "vizdoom-turbo==1.3.0.post23; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "vizdoom-turbo==1.3.0.post23; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "stable-baselines3>=2.3,<3",
    "ale-py>=0.12,<0.13",
    "opencv-python>=4.13,<5",
    "torch==2.13.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorboard>=2.16,<3",
    "wandb>=0.18,<0.23",
    "wandb-workspaces>=0.4,<0.5",
    "boto3>=1.34,<2",
    "certifi>=2026.5.20",
    "pyyaml>=6,<7",
    "omegaconf>=2.3,<3",
    "huggingface-hub>=1.0,<2",
    "jinja2>=3.1,<4",
    "pydantic>=2.13,<3",
    "captum>=0.9,<1",
    "numba>=0.65.1,<0.66",
    "modal>=1.3,<2",
    "rich>=15,<16",
    "tqdm>=4.67,<5",
    "textual>=8.2.8,<9",
    "aiohttp>=3.14,<4",
    "pillow>=11,<13",
]

[project.scripts]
gradlab = "gradlab.main:main"

[project.optional-dependencies]
dataset = [
    "datasets>=5,<6",
    "pillow>=11,<13",
]
dataset-minari = [
    "datasets>=5,<6",
    "pillow>=11,<13",
    "minari>=0.5,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gradlab"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"
"METRICS.md" = "gradlab/METRICS.md"
"experiments/goals" = "gradlab/experiments/goals"
"experiments/recipes" = "gradlab/experiments/recipes"

[tool.hatch.build.targets.sdist]
include = [
    "/src/gradlab",
    "/experiments/goals",
    "/experiments/recipes",
    "/README.md",
    "/METRICS.md",
    "/THIRD_PARTY_NOTICES.md",
]

[tool.uv]
exclude-newer = "7 days"
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
constraint-dependencies = [
    "mistralai!=2.4.6",
    "guardrails-ai!=0.10.1",
]

[tool.uv.exclude-newer-package]
breakout-turbo-env = "2026-07-29T13:20:49Z"
stable-retro-turbo = "2026-07-29T13:20:49Z"
supermariobrosnes-turbo = "2026-07-29T13:20:49Z"
vizdoom-turbo = "2026-08-07T07:22:15Z"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]
release = [
    "twine>=6,<7",
]
modal-deploy = [
    "jinja2>=3.1,<4",
    "modal>=1.3,<2",
    "omegaconf>=2.3,<3",
    "pydantic>=2.13,<3",
]
train-image-build = [
    "packaging>=25,<26",
]
train-runtime = [
    "stable-retro-turbo==1.0.1.post37; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "supermariobrosnes-turbo==0.6.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "breakout-turbo-env==0.5.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "vizdoom-turbo==1.3.0.post23; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "stable-baselines3>=2.3,<3",
    "ale-py>=0.12,<0.13",
    "opencv-python>=4.13,<5",
    "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorboard>=2.16,<3",
    "pillow>=11,<13",
    "rich>=15,<16",
    "tqdm>=4.67,<5",
    "wandb>=0.18,<0.23",
    "boto3>=1.34,<2",
    "certifi>=2026.5.20",
    "pyyaml>=6,<7",
    "huggingface-hub>=1.0,<2",
    "captum>=0.9,<1",
    "numba>=0.65.1,<0.66",
    "modal>=1.3,<2",
    "omegaconf>=2.3,<3",
]
