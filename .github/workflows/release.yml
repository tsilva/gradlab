name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA on main to validate (empty uses the dispatch SHA)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: .uv-cache
  UV_CONFIG_FILE: ${{ github.workspace }}/uv-tool.toml

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Verify source identity
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
            if [[ -n "$REQUESTED_REF" ]]; then
              [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ && "$sha" == "$REQUESTED_REF" ]] || exit 1
            fi
            git merge-base --is-ancestor "$sha" origin/main
          else
            [[ "$sha" == "$GITHUB_SHA" ]] || exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building source $sha"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify reviewed release notes
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SOURCE: ${{ steps.source.outputs.sha }}
        run: >-
          python3 scripts/release_payload.py extract
          --tag "$RELEASE_VERSION" --version "${RELEASE_VERSION#v}"
          --source "$RELEASE_SOURCE" --output "$RUNNER_TEMP/release-notes.md"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build locked player assets
        run: |
          npm install --global pnpm@10.33.0 --ignore-scripts --min-release-age=10080
          pnpm install --frozen-lockfile
          pnpm check:web
          pnpm build:web

      - name: Install locked environments
        run: |
          uv lock --check
          uv sync --frozen --group dev --group release

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv run python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        run: >-
          uv run python scripts/release_build.py
          check-version --version "${{ steps.version.outputs.version }}"

      - name: Install recording test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Lint source
        run: uv run ruff check .

      - name: Run Python tests
        run: uv run pytest -q ${{ github.event_name == 'push' && '--maxfail=1' || '' }}

      - name: Validate configuration
        run: uv run gradlab validate

      - name: Certify lifecycle determinism
        run: |
          evidence="$(mktemp -d)"
          uv run gradlab experiment certify --tier simulated --json > "$evidence/first.json"
          uv run gradlab experiment certify --tier simulated --json > "$evidence/second.json"
          cmp "$evidence/first.json" "$evidence/second.json"
          cat "$evidence/first.json"

      - name: Build and audit release distributions
        run: >-
          uv run python scripts/release_build.py build
          --version "${{ steps.version.outputs.version }}"
          --out-dir dist/release-v${{ steps.version.outputs.version }}
          ${{ github.event_name == 'workflow_dispatch' && '--allow-published' || '' }}

      - name: Upload audited distribution bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-v${{ steps.version.outputs.version }}
          path: dist/release-v${{ steps.version.outputs.version }}/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/gradlab
    permissions:
      id-token: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - build
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.build.outputs.source-sha }}

      - name: Extract reviewed release notes
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SOURCE: ${{ needs.build.outputs.source-sha }}
        run: >-
          python3 scripts/release_payload.py extract
          --tag "$GITHUB_REF_NAME" --version "$RELEASE_VERSION"
          --source "$RELEASE_SOURCE" --output "$RUNNER_TEMP/release-notes.md"

      - name: Download audited distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --title "$(cat "$RUNNER_TEMP/release-notes.md.title")"
