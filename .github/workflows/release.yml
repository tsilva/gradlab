name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA on main to validate (empty uses the dispatch SHA)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: .uv-cache

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Verify source identity
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
            if [[ -n "$REQUESTED_REF" ]]; then
              [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ && "$sha" == "$REQUESTED_REF" ]] || exit 1
            fi
            git merge-base --is-ancestor "$sha" origin/main
          else
            [[ "$sha" == "$GITHUB_SHA" ]] || exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building source $sha"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build locked player assets
        run: |
          npm install --global pnpm@10.33.0 --ignore-scripts --min-release-age=10080
          pnpm install --frozen-lockfile
          pnpm check:web
          pnpm build:web

      - name: Install locked environments
        run: |
          uv lock --check
          uv sync --frozen --group dev --group release

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv run python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        run: >-
          uv run python scripts/release_build.py
          check-version --version "${{ steps.version.outputs.version }}"

      - name: Run source checks
        run: |
          uv run ruff check .
          uv run pytest -q
          uv run gradlab validate
          uv run gradlab experiment certify --tier simulated --json

      - name: Build and audit release distributions
        run: >-
          uv run python scripts/release_build.py build
          --version "${{ steps.version.outputs.version }}"
          --out-dir dist/release-v${{ steps.version.outputs.version }}
          ${{ github.event_name == 'workflow_dispatch' && '--allow-published' || '' }}

      - name: Upload audited distribution bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v${{ steps.version.outputs.version }}
          path: dist/release-v${{ steps.version.outputs.version }}/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/gradlab
    permissions:
      id-token: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - build
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
