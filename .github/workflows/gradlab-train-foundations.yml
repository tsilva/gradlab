name: gradlab train foundations

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact pushed Git revision whose foundation contract should be resolved
        required: true
        type: string
      publish:
        description: Publish missing immutable foundation images
        required: true
        type: boolean
    outputs:
      created:
        value: ${{ jobs.resolve.outputs.created }}
      uv_lock_sha256:
        value: ${{ jobs.resolve.outputs.uv_lock_sha256 }}
      python_image:
        value: ${{ jobs.resolve.outputs.python_image }}
      uv_image:
        value: ${{ jobs.resolve.outputs.uv_image }}
      gpu_key:
        value: ${{ jobs.resolve.outputs.gpu_key }}
      gpu_plan_sha256:
        value: ${{ jobs.resolve.outputs.gpu_plan_sha256 }}
      gpu_digest:
        value: ${{ jobs.resolve.outputs.gpu_digest }}
      gpu_base:
        value: ${{ jobs.resolve.outputs.gpu_base }}
      dependency_key:
        value: ${{ jobs.resolve.outputs.dependency_key }}
      dependency_digest:
        value: ${{ jobs.resolve.outputs.dependency_digest }}
      dependency_base:
        value: ${{ jobs.resolve.outputs.dependency_base }}
      train_plan_sha256:
        value: ${{ jobs.resolve.outputs.train_plan_sha256 }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GPU_IMAGE_NAME: ${{ github.repository }}/gradlab-train-gpu
  DEPENDENCY_IMAGE_NAME: ${{ github.repository }}/gradlab-train-dependencies
  SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    concurrency:
      group: train-foundations-${{ inputs.source_sha }}
      cancel-in-progress: false
    outputs:
      created: ${{ steps.meta.outputs.created }}
      uv_lock_sha256: ${{ steps.meta.outputs.uv_lock_sha256 }}
      python_image: ${{ steps.meta.outputs.python_image }}
      uv_image: ${{ steps.meta.outputs.uv_image }}
      gpu_key: ${{ steps.meta.outputs.gpu_key }}
      gpu_plan_sha256: ${{ steps.meta.outputs.gpu_plan_sha256 }}
      gpu_digest: ${{ steps.gpu.outputs.digest }}
      gpu_base: ${{ steps.gpu.outputs.base }}
      dependency_key: ${{ steps.dependency_meta.outputs.key }}
      dependency_digest: ${{ steps.dependency.outputs.digest }}
      dependency_base: ${{ steps.dependency.outputs.base }}
      train_plan_sha256: ${{ steps.meta.outputs.train_plan_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Validate deterministic lock projections
        id: locks
        run: |
          train_plan_sha256=$(
            uv run --frozen --only-group train-image-build \
              python containers/train/lock_projection.py --check --print-train-plan-sha256
          )
          echo "train_plan_sha256=$train_plan_sha256" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve foundation metadata
        id: meta
        run: |
          {
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "uv_lock_sha256=$(sha256sum uv.lock | awk '{print $1}')"
            echo "gpu_key=$(python containers/train/gpu_key.py)"
            echo "gpu_plan_sha256=$(sha256sum containers/train/gpu-linux-amd64.lock | awk '{print $1}')"
            echo "train_plan_sha256=${{ steps.locks.outputs.train_plan_sha256 }}"
            echo "python_image=$(awk -F= '/^ARG PYTHON_IMAGE=/ {print $2; exit}' containers/train/Dockerfile)"
            echo "uv_image=$(awk -F= '/^ARG UV_IMAGE=/ {print $2; exit}' containers/train/Dockerfile)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve immutable GPU image
        id: existing_gpu
        if: inputs.publish
        run: |
          image="${REGISTRY}/${GPU_IMAGE_NAME}:build-${{ steps.meta.outputs.gpu_key }}"
          if metadata=$(docker buildx imagetools inspect "$image" 2>/dev/null); then
            echo "digest=$(awk '/^Digest:/ {print $2; exit}' <<<"$metadata")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build GPU foundation
        id: build_gpu
        if: inputs.publish && steps.existing_gpu.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/train/Dockerfile
          target: gpu
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.GPU_IMAGE_NAME }}:build-${{ steps.meta.outputs.gpu_key }}
          build-args: GPU_PLAN_SHA256=${{ steps.meta.outputs.gpu_plan_sha256 }}

      - name: Select GPU identity
        id: gpu
        env:
          BUILT: ${{ steps.build_gpu.outputs.digest }}
          EXISTING: ${{ steps.existing_gpu.outputs.digest }}
          GPU_KEY: ${{ steps.meta.outputs.gpu_key }}
        run: |
          digest="${BUILT:-${EXISTING:-}}"
          if [[ -n "$digest" ]]; then
            base="${REGISTRY}/${GPU_IMAGE_NAME}@${digest}"
          elif [[ "${{ inputs.publish }}" == "false" ]]; then
            digest="sha256:${GPU_KEY}"
            base=gpu
          else
            echo "::error::No immutable GPU image is available"
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve dependency key
        id: dependency_meta
        run: |
          key=$(python containers/train/dependency_key.py --gpu-digest '${{ steps.gpu.outputs.digest }}')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable dependency image
        id: existing_dependency
        if: inputs.publish
        run: |
          image="${REGISTRY}/${DEPENDENCY_IMAGE_NAME}:build-${{ steps.dependency_meta.outputs.key }}"
          if metadata=$(docker buildx imagetools inspect "$image" 2>/dev/null); then
            echo "digest=$(awk '/^Digest:/ {print $2; exit}' <<<"$metadata")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build train dependencies
        id: build_dependency
        if: inputs.publish && steps.existing_dependency.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/train/Dockerfile
          target: dependencies
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.DEPENDENCY_IMAGE_NAME }}:build-${{ steps.dependency_meta.outputs.key }}
          build-args: |
            GPU_BASE=${{ steps.gpu.outputs.base }}
            GPU_IMAGE=${{ env.REGISTRY }}/${{ env.GPU_IMAGE_NAME }}
            GPU_IMAGE_DIGEST=${{ steps.gpu.outputs.digest }}
            TRAIN_PLAN_SHA256=${{ steps.meta.outputs.train_plan_sha256 }}

      - name: Select dependency identity
        id: dependency
        env:
          BUILT: ${{ steps.build_dependency.outputs.digest }}
          EXISTING: ${{ steps.existing_dependency.outputs.digest }}
          DEPENDENCY_KEY: ${{ steps.dependency_meta.outputs.key }}
        run: |
          digest="${BUILT:-${EXISTING:-}}"
          if [[ -n "$digest" ]]; then
            base="${REGISTRY}/${DEPENDENCY_IMAGE_NAME}@${digest}"
          elif [[ "${{ inputs.publish }}" == "false" ]]; then
            digest="sha256:${DEPENDENCY_KEY}"
            base=dependencies
          else
            echo "::error::No immutable dependency image is available"
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
